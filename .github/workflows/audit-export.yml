# The daily audit's inputs, beside Maintenance rather than in it: the held cards and the shadow critic's verdicts of the
# last two days into docs/audit/live/ on the working branch (owner, 2026-10-22: "shadow card audit"). Its own
# concurrency group: Maintenance keeps one pending run, and a seed pass's self-dispatch would cancel an export queued
# behind it. No AI, no D1 writes.
name: Audit export

on:
  workflow_dispatch:
  schedule:
    - cron: "21 4 * * *"   # 09:51 IST, before the 10:07 audit run

permissions:
  contents: write   # commits the export to the working branch

concurrency:
  group: audit-export
  cancel-in-progress: false

# The card and memory switches come from pipeline/config/switches.toml, the same in every job; a repository variable of
# the same name wins over it (settings._switch). REPO_VARS carries them all, so none has to be listed here.
env:
  REPO_VARS: ${{ toJSON(vars) }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "."
      - name: Held cards and what keeps them
        run: |
          mkdir -p ../docs/audit/live
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel export-held --out "../docs/audit/live/held-$(date -u +%F).json"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel release-pruned --dry-run > "../docs/audit/live/held-why-$(date -u +%F).json"
      # the shadow critic is off (D41, 24 Oct 2026): its export runs only when the repository variable CRITIC is 1
      - name: The shadow critic's verdicts
        if: vars.CRITIC == '1'
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel critic-export --since "$(date -u -d "-1 day" +%F)" --out "../docs/audit/live/critic-$(date -u +%F).json"'
      # kept as an artifact every time; committed only to the branch the repository variable AUDIT_BRANCH names (27 Oct
      # 2026: the default was a parked branch no session reads, so the exports went nowhere anyone looked)
      - name: Collect today's export
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/audit-export"
          cp docs/audit/live/held-*$(date -u +%F)*.json docs/audit/live/critic-$(date -u +%F).json "$RUNNER_TEMP/audit-export/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: audit-export
          path: ${{ runner.temp }}/audit-export/
          if-no-files-found: ignore
      - name: Commit the export
        if: vars.AUDIT_BRANCH != ''
        working-directory: .
        env:
          BRANCH: ${{ vars.AUDIT_BRANCH }}   # the lead session's working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=$(ls docs/audit/live/held-*$(date -u +%F)*.json docs/audit/live/critic-$(date -u +%F).json 2>/dev/null)
          [ -n "$files" ] || { echo "nothing exported"; exit 0; }
          cp $files "$RUNNER_TEMP/"
          # out of the tree before the checkout: the branch may already have today's file (an earlier run, or
          # maintenance.yml's export), and the checkout refuses to overwrite an untracked one
          git reset -q --hard && git clean -qf docs/audit/live/
          git fetch -q origin "$BRANCH"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          mkdir -p docs/audit/live
          for f in $files; do cp "$RUNNER_TEMP/$(basename "$f")" "$f"; done
          git add docs/audit/live/
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "audit-export: held cards, what keeps them, and the critic's verdicts for the live review"
          git push -q origin "$BRANCH"
