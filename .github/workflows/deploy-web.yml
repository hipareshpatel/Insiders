# Deploys the Worker (API + React app) and applies D1 migrations.
# Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the
# repository variable D1_DATABASE_ID (from `wrangler d1 create bse-index-nse`).
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "db/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # wrangler.jsonc carries the real id since 2026-10-20; the variable, when set, still overrides it
      - name: Point wrangler at the real D1 database
        if: ${{ vars.D1_DATABASE_ID != '' }}
        run: |
          sed -i -E 's/("database_id": ")[0-9a-f-]*"/\1${{ vars.D1_DATABASE_ID }}"/' wrangler.jsonc
      - run: npm run build
      - run: npx wrangler d1 migrations apply bse-index-nse --remote
      - run: npx wrangler deploy
      # F147: filing texts under text/ in R2 are deleted 180 days after they are written (owner, 25 Oct 2026).
      # Idempotent: the rule is added only when the bucket's list does not already name it. A token without R2 edit
      # rights only warns; the deploy above has already gone out.
      - name: R2 lifecycle, delete text/ after 180 days
        working-directory: web
        continue-on-error: true
        run: |
          if npx wrangler r2 bucket lifecycle list bse-intelligence 2>&1 | tee /tmp/lifecycle.txt | grep -q "text-180d"; then
            echo "lifecycle rule text-180d already present"
          elif npx wrangler r2 bucket lifecycle add bse-intelligence text-180d text/ --expire-days 180 --force; then
            echo "lifecycle rule text-180d added"
          else
            cat /tmp/lifecycle.txt
            echo "::warning::R2 lifecycle rule text-180d not applied (API token needs R2 edit permission); texts under text/ are NOT auto-deleted until it is"
          fi
