#   codes or symbols). xbrl-key.csv, summary.json and xbrl-key.md go up as the artifact `xbrl-key`, written every 10 filings or 3
#   minutes, and the rows also go to R2 (`meta/xbrl-key/xbrl-key[-<ids>].csv`: the name does not hold the run id, so a fresh
#   dispatch with the same `ids` continues the earlier run and skips the filings it finished; `restart` starts clean), so a run
#   stopped by its time budget, the file cap or a lost runner keeps what it did. A filing whose announcement list or download
#   failed is `fetch_failed`, never `not_found`, and is read again on the next dispatch. Writes nothing to memory, cards or the
#   branch. No AI.
# - screener-explain: read only (owner 26 Oct 2026). Of the `screener-referee` pairs where our figure equals NSE's own file,
#   which differences a later bonus, split or consolidation (the dossier's corporate actions) or a later results file
#   (memory's stored later-file source, else NSE's file) explains. The job takes the newest unexplained `screener-referee`
#   artifact like pdf-referee. explained.csv, summary.json and the markdown go up as the artifact `screener-explain`; its
#   `unexplained` rows are what `pdf-referee --explained` then reads. Writes nothing to memory, cards or the branch. No AI.
# - nse-speedtest: read only (F168, owner 26 Oct 2026). 100 seeded universe companies: their file links listed as the seed
#   lists them (timed), the all-company results list timed, then downloads from nsearchives only in rounds on different files
#   (A 3-5 s as today, B 1 s, C 0.3 s, D 0 s, E four workers at 0 s); a round stops at the first 403/429/503 or third timeout,
#   waits 60 s and no faster round follows. Writes nothing to D1, R2 or memory; artifact `nse-speedtest` (nse-speedtest.json).
# - call-memory: read only (F180, TODO 83, owner 26 Oct 2026). The call-memory reading (MEMORY_CALL_V2's step, call_memory.py) of the
#   filings named in `ids` (transcripts and decks, news ids): stored text and memory in, one AI call each on the free providers
#   (never DeepSeek), the checked points and every dropped point with its reason out. One <news_id>.json each and summary.json go up
#   as the artifact `call-memory`. Writes nothing to memory (the measurement run; --apply is for the laptop).
# - fact-sheet-ab: read only (TODO 131 and 134, owner 30 Oct 2026). The A/B of CARD_FACT_SHEET: the results filings named in `ids` (news
#   ids) each made into a card twice by the live code (pipeline.analyze), the switch off and then on, with the free AI providers the card
#   path uses (two calls a filing, never DeepSeek); the sink is read-only (every D1, R2 and memory write dropped and counted). One
#   <news_id>.json each (off, on, changed fields, what the table and the text check changed) and summary.json go up as the artifact
#   `fact-sheet-ab`. Writes nothing live.
# - restated-pdf-trial: read only (F202, TODO 104). restated-pdf --dry-run: the latest six quarters' results PDFs of the companies
#   in `ids` (or the first `limit` of the universe), text layer only, and every comparative that differs from memory's original
#   listed with both figures and their sources (artifact `restated-pdf-trial`). Writes nothing; storing waits for its review.
# - memory-gaps-fill-bse: the one-time fill (F201, TODO 100, owner 27 Oct 2026) of the results quarters memory lacks for companies
#   whose NSE results list is empty (listed on NSE in 2026, earlier quarters on BSE only), from BSE's results XBRL through the seed's
#   BSE path, for companies at the universe's market-cap floor (500 Cr) or more. NSE's list is read at run time; a figure memory
#   already holds is never overwritten; each figure written carries exchange BSE and the file's address. A dry run unless the
#   input `apply` is set (the summary, a CSV of every figure and the log go up as the artifact `memory-gaps-fill-bse`). `restart`
#   tries the companies an earlier apply run handled. The daily pipeline stays NSE only. Group maint-nse-memory.
# - statements-backfill: every company's past statements by screener's rules (screener_view recipes) from the facts already
#   stored in R2 (raw/xbrl-facts/), into dossier['statements']: quarters, years, balance sheets, cash flows, both bases. No NSE
#   request. A dry run unless `apply`; `file_cap` unused; at most 50 companies a run, resuming (restart starts again); each
#   dossier backed up first (backup/statements-backfill-<time>/), so `restore` undoes it. Group maint-nse-memory.
# - statements-rebuild: the same with --replace: a file-labelled entry the stored facts now build differently (a recipe change)
#   is put back with the current recipes (backup/statements-rebuild-<time>/; `restore` undoes it). Dry run unless apply.
# - statements-correct: the profit-line rules (screener_view.corrected_pl: owners' profit that does not add up with the minority's
#   share, the filler 0, a profit on the wrong side of PBT - Tax) over every file-labelled quarters and annual entry already stored in
#   dossier['statements'], so the stock page reads what the cards and Results read. No NSE request, no AI. A dry run unless `apply`
#   (the changes, scrip / period / basis / table / row / old / new, go up as the artifact `statements-correct`, JSON, CSV and text);
#   with `apply` each changed dossier is backed up first (R2 backup/statements-correct-<time>/), so `restore` undoes it, and written
#   chunk by chunk, resuming after the last saved chunk (`restart` starts again; `ids` = only these companies, scrip codes; `limit` =
#   at most N companies a run, empty = all). Group maint-nse-memory.
# - memory-rerank: re-ranks stored figures under TODO 118 B (dossier._metric_entry: a live filing's own file figure above a model's
#   later reading). A figure is rebuilt from its own sources only when its stored value is the old rule's and the new rule gives
#   another; at most 50 figures a run (rule A), whole companies; each dossier is backed up first (R2 backup/memory-rerank-<time>/),
#   so `restore` undoes it. A dry run unless `apply`. The report goes up as the artifact `memory-rerank`. Group maint-nse-memory.
# - memory-drop-known-wrong: takes the figures on the code-held known-wrong list (known_wrong.py, F223: the exchange's own file differs
#   from the company's own results statement; each with its evidence) out of the stored dossiers, no AI and no exchange. A dry run unless
#   the input `apply` is set; `ids` names listed companies (scrip codes), empty means every listed one. Each dossier is backed up
#   (R2 backup/memory-drop-known-wrong-<time>/, before and after) before it is written, so `restore` undoes it. A stored figure goes only
#   when its metric, period, basis and value are the listed ones. The report goes up as the artifact `memory-drop-known-wrong`. Group
#   maint-nse-memory (it writes memory, so it never runs beside a seed).
# None calls an AI model; seed-memory, memory-gaps-fill and fill-memory read NSE. It runs beside the pipeline (its own concurrency group:
# a shared one would cancel a pending pipeline run); fill-memory pauses the AI pipeline while it writes memory.
# CONCURRENCY GROUPS (owner, 26 Oct 2026; F164). Jobs wait in the group of their SOURCE and what they WRITE, so jobs on
# different sources run side by side, and two jobs that write the same store never run together. cancel-in-progress is
# false and a group keeps one waiting run (a newer one replaces the waiting one): do not queue two commands of one group.
#   group              commands
#   maint-nse-memory   everything that reads NSE or writes memory: seed-memory, memory-gaps-fill, memory-gaps-fill-bse, memory-drop-known-wrong, memory-rerank, statements-backfill, statements-correct, fill-memory, fill-trades,
#                      label-memory-apply, screener-fill-apply, prune-companies-apply (writes memory and companies),
#                      text-backfill (reads NSE; writes only text/ objects)
#   maint-cards        writes cards in D1 (or commits to the branch): refresh-card-blocks, refresh-summaries, both,
#                      requeue-failed, apply-verdicts, release-pruned, export-held, export-critic, restore (puts a backup of
#                      cards and memory back; it can overlap a memory job, so do not run it beside one)
#   maint-bse          probe-bse, bse-results-test, bse-verify-kept, text-backfill-bse (reads BSE; writes only text/ objects)
#   maint-screener     screener-download, screener-fill (the dry run reads screener.in)
#   maint-tijori       tijori-download (reads tijorifinance.com; writes only raw/tijori/ objects)
#   maint-pdf-store    store-kept-pdfs (reads a GitHub artifact; writes only raw/results-pdf/ objects)
#   maint-ro-<command> read-only, one group per command (so each runs beside everything else, never beside itself):
#                      failed-report, memory-gaps (memory only), label-memory, prune-companies (compares the companies table
#                      with NSE's lists, writes nothing), audit-precision, release-check, screener-crosscheck (R2 and memory), screener-rows (R2 only; writes nothing), xbrl-facts (R2 and memory; writes only raw/xbrl-facts/ in R2; a run with `apply` downloads NSE files and is in the NSE memory group), tijori-crosscheck (R2 and memory; writes nothing), tijori-referee (R2, memory and NSE; writes nothing), screener-referee (R2, memory and NSE; writes nothing), pdf-referee (the referee CSV and NSE; writes nothing), xbrl-key (R2, memory and NSE; writes only raw/results-pdf/, each PDF it downloads), pdf-oos (R2, memory and NSE; writes only raw/results-pdf/), screener-explain (the referee CSV, memory and NSE; writes nothing), restated-report (memory only), restated-pdf-trial (memory and NSE; writes nothing), memory-recall-export (R2 and memory; writes nothing), nse-selfcheck (memory only), prediction-units (memory only), nse-speedtest (reads NSE; writes nothing), call-memory (R2, memory and the free AI providers; writes nothing), fact-sheet-ab (the card path's free AI providers; writes nothing)
# A command in no list falls into maint-cards; add a new command to the right list in `concurrency.group` below.
#
# CHAINING: the input `then` is a comma-separated list of commands, each optionally `command:restart` (passes restart=true),
# e.g. command=memory-gaps-fill, then="seed-memory:restart,label-memory". When the run's work has succeeded, the final job
# `chain` dispatches the first command of `then` with `then` = the rest (gh workflow run, same ref). It does not fire when any
# job failed or was cancelled. Commands that resume themselves are chained only when FINISHED:
#   - seed-memory (seed-next) and memory-gaps-fill (gaps-next) start the next pass while any shard timed out (exit 124) and
#     pass `then` along on that re-dispatch; the pass that finds nothing left lets `chain` run the first of `then`;
#   - screener-download, screener-fill, screener-fill-apply, tijori-download, text-backfill and label-memory-apply (exit 124 = resume) leave a marker
#     artifact (`*-more-*`) when time ran out; with a non-empty `then`, `chain` then re-dispatches the same command with the
#     same `then` (restart=false) instead of the next one; with `then` empty they stay manual, as before;
#   - fill-memory starts its own seed-memory passes at its end and hands `then` to them; `chain` does nothing for it.
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      command:
        description: what to run
        type: choice
        options: [refresh-card-blocks, refresh-summaries, both, export-held, export-critic, requeue-failed, failed-report, probe-bse, bse-results-test, bse-verify-kept, apply-verdicts, seed-memory, fill-memory, fill-trades, release-pruned, memory-gaps, memory-gaps-fill, memory-gaps-fill-bse, memory-drop-known-wrong, memory-rerank, statements-backfill, statements-rebuild, statements-correct, results-table, reit-results, prune-companies, prune-companies-apply, label-memory, label-memory-apply, audit-precision, release-check, screener-fill, screener-fill-apply, screener-download, screener-schedules, bse-annual-xbrl, bse-results-xbrl, keep-annual-pdfs, screener-crosscheck, screener-rows, xbrl-facts, screener-referee, screener-explain, pdf-referee, xbrl-key, pdf-oos, store-kept-pdfs, deck-pdfs, api-reader-hardset, api-reader-oos, pdf-referee-ensemble, tijori-download, tijori-crosscheck, tijori-referee, pdf-referee-tijori, text-backfill, text-backfill-bse, restated-report, restated-pdf-trial, pdf-bench, xbrl-expiry-check, facts-dump, memory-recall-export, nse-selfcheck, prediction-units, nse-speedtest, call-memory, fact-sheet-ab, restore]
        default: both
      backup:
        description: store-kept-pdfs - the artifact name (empty = pdf-oos-pdfs); restore only - the backup's R2 prefix (backup/<job>-<time>/); empty lists the backups. Needs `scrips` or `ids` (the cards' news ids) to name what goes back, or `all` in `ids`
        type: string
        default: ''
      scrips:
        description: restore only - put back these companies' memory and cards (scrip codes, comma separated)
        type: string
        default: ''
      restore_mode:
        description: restore only - preview (default; writes nothing), apply (puts back what the job changed and nobody has changed since), apply-force (also what was changed since; and a backup with no after-state, which is every requeue-failed --ids backup)
        type: choice
        options: [preview, apply, apply-force]
        default: preview
      ids:
        description: release-check - only these checks (names, comma separated, e.g. text_support; empty = all); screener-crosscheck, screener-rows and xbrl-facts - only these companies (scrip codes or NSE symbols, comma separated); restore - the cards to put back (news ids, comma separated), or `all` for everything in the backup; requeue-failed - re-run these filings instead; call-memory - the transcripts and decks to read (news ids, comma separated); fact-sheet-ab - the results filings to make twice, switch off and on (news ids, comma separated); xbrl-key - only these companies (scrip codes or NSE symbols, comma separated); pdf-oos - the seed of the company shuffle (a number, default 29; 28 is the seed earlier xbrl-key runs used); store-kept-pdfs - the run id whose artifact holds the kept PDFs; memory-drop-known-wrong - only these listed companies (scrip codes); memory-rerank, statements-backfill and statements-correct - only these companies (scrip codes), statements-backfill `put-back-ratings` the rating snapshots taken out on 30 Oct, from the backups; pdf-referee-ensemble - `tijori` reads the tijori-referee artifact instead of the screener-referee one; `hardset` reads the answer key docs/bench/hardpdf/key.csv and scores every reader against it; pdf-referee - `explained` reads the screener-explain artifact (its unexplained rows); screener-referee - `archive` reads the file names memory holds and the archive host only (no results list); seed-memory - re-read only these companies (scrip codes or NSE symbols); restated-pdf-trial - only these companies
        type: string
        default: ''
      since:
        description: requeue-failed only - failed filings filed on or after this date (YYYY-MM-DD); default the last 30 days
        type: string
        default: ''
      restart:
        description: seed-memory only - start again from the first company; memory-gaps-fill - try the companies an earlier pass tried; xbrl-key - ignore the rows an earlier run saved and start clean
        type: boolean
        default: false
      days:
        description: fill-memory only - days of NSE's shareholding list to read (110 covers the last two quarters)
        type: string
        default: '110'
      limit:
        description: screener-crosscheck and xbrl-facts - only the N largest companies by market cap (of `ids`, else of the universe); text-backfill - a trial on the first N cards lacking text; screener-referee and pdf-referee - at most N pairs refereed (empty = all); xbrl-key - at most N filings read (empty = all); pdf-oos - filings read and scored (empty = 100); pdf-bench - the first N PDFs of each key (empty = all); memory-recall-export - filings in the sample (empty = 20); restated-pdf-trial - at most N companies; screener-rows - the N largest by market cap (empty = 50)
        type: string
        default: ''
      no_ocr:
        description: text-backfill and pdf-referee - skip local OCR (text layer only; pdf-referee then counts only text-layer readings)
        type: boolean
        default: false
      sample:
        description: pdf-referee only - instead of the open pairs, a random sample of N pairs where memory equals NSE's file (tests the file against its PDF)
        type: string
        default: ''
      then:
        description: commands to run after this one succeeds, comma separated; name:restart passes restart=true (see the header)
        type: string
        default: ''
      apply:
        description: memory-gaps-fill-bse, memory-drop-known-wrong, memory-rerank, statements-backfill, statements-rebuild and statements-correct only - write (the figures labelled BSE; the listed figures taken out, after a backup); without it a dry run that writes nothing; xbrl-facts - also download the files that are not stored (NSE, the seed's fetch and pace, counts toward file_cap, which is required, the first run is 100)
        type: boolean
        default: false
      dry_run:
        description: count what would change, write nothing (refresh-card-blocks, requeue-failed, release-pruned, xbrl-facts)
        type: boolean
        default: false
      min_mcap_cr:
        description: memory-gaps-fill-bse only - fill only companies with at least this market cap (Rs Cr); empty means the universe's 500
        type: string
        default: ''
      annual:
        description: xbrl-facts only - also keep the annual-report XBRL (Ind AS only, never BRSR, the latest 3 years a basis), one NSE list request a company, so the run joins the NSE memory group; a file not stored is fetched only with apply
        type: boolean
        default: false
      archive_pause:
        description: xbrl-facts only - seconds between two requests to the archive host, "low,high" (the seed job sets "0,0"; the API keeps its 3-5 s and a refusal from the archive host slows it back); empty keeps the shared 3-5 s pace
        type: string
        default: ''
      from_nse:
        description: xbrl-facts only - with apply, list each company's results files from NSE's own list (the latest 12 quarters, both bases; the screener comparison starts at FY26) and download every file not stored, keeping its facts as it goes; no memory write (one list request a company, not counted toward file_cap; each file is)
        type: boolean
        default: false
      shards:
        description: xbrl-facts only - run as this many parallel runners, 1 to 16 (owner, 28 Oct 2026, 8 then 16), each its own NSE client; file_cap is split over them (file_cap // shards each, at least 1 each, so a file_cap below shards gives every shard 1 file)
        type: string
        default: '1'
      only_model:
        description: call-memory and fact-sheet-ab - a measured test locked on one model (provider:model, e.g. gemini_3:gemini-3.5-flash-lite; for fact-sheet-ab, nvidia:minimaxai/minimax-m3.1-flash, groq:qwen/qwen3.8-27b, groq:openai/gpt-oss-120b writes every card with it, switch on only); empty = the route as live
        type: string
        default: ''
      part_chars:
        description: call-memory only - characters a part for a measured test (live 60000); empty = live
        type: string
        default: ''
      reasoning:
        description: call-memory only - the Gemini models' thinking for a measured test (none, low, medium, high); empty = as configured
        type: string
        default: ''
      prompt:
        description: call-memory only - v2 or v3 reads with a held prompt (config/prompts/call_memory_v2.md; v3 = v2 with the chart rule, TODO 144) for a measured test; empty = live
        type: string
        default: ''
      file_cap:
        description: a test run's cap on NSE/BSE files (owner, 27 Oct 2026, the first test of a fetch is 100 files); empty means no cap
        type: string
        default: ''

permissions:
  contents: write   # export-held commits its file to the working branch; the other commands only read the repository
  actions: write    # seed-memory starts its next pass (workflow_dispatch) while companies are left

concurrency:
  # (reit-results: NSE downloads and a write to companies and results_kpi, so the NSE memory group. No # inside the expression below: GitHub reads it as part of it.)
  # groups by source and by what a job writes: the table in the header comment (a downloading xbrl-facts run is NSE traffic: the NSE memory group)
  group: >-
    ${{ contains(fromJSON('["keep-annual-pdfs","seed-memory","memory-gaps-fill","memory-gaps-fill-bse","memory-drop-known-wrong","memory-rerank","statements-backfill","statements-rebuild","statements-correct","fill-memory","fill-trades","label-memory-apply","screener-fill-apply","prune-companies-apply","text-backfill"]'), inputs.command) && 'maint-nse-memory'
    || (inputs.command == 'xbrl-facts' && (inputs.apply || inputs.annual)) && 'maint-nse-memory'
    || inputs.command == 'reit-results' && 'maint-nse-memory'
    || contains(fromJSON('["refresh-card-blocks","refresh-summaries","both","requeue-failed","apply-verdicts","release-pruned","export-held","export-critic","results-table","restore"]'), inputs.command) && 'maint-cards'
    || contains(fromJSON('["text-backfill-bse","bse-annual-xbrl","bse-results-xbrl"]'), inputs.command) && format('maint-bse-{0}', inputs.command)
    || contains(fromJSON('["probe-bse","bse-results-test","bse-verify-kept"]'), inputs.command) && 'maint-bse'
    || contains(fromJSON('["screener-download","screener-schedules","screener-fill"]'), inputs.command) && 'maint-screener'
    || inputs.command == 'tijori-download' && 'maint-tijori'
    || inputs.command == 'store-kept-pdfs' && 'maint-pdf-store'
    || contains(fromJSON('["failed-report","memory-gaps","label-memory","prune-companies","audit-precision","release-check","screener-crosscheck","screener-rows","xbrl-facts","tijori-crosscheck","tijori-referee","screener-referee","screener-explain","pdf-referee","xbrl-key","pdf-referee-tijori","pdf-referee-ensemble","pdf-bench","pdf-oos","restated-report","restated-pdf-trial","memory-recall-export","nse-selfcheck","prediction-units","nse-speedtest","call-memory","fact-sheet-ab","api-reader-hardset","deck-pdfs","xbrl-expiry-check","facts-dump"]'), inputs.command) && format('maint-ro-{0}', inputs.command)
    || 'maint-cards' }}
  cancel-in-progress: false

# F215 (owner 27 Oct: merge and switch on once reviewed): the PDF referee and reader paths read two-digit years, rank pages and
# take the profit total; maintenance only. The live pipeline keeps them off: its restated-YoY and unit-slip checks share this
# code and need the on/off over stored cards first (review of e559bcb). A repository variable set to 0 turns one off.
env:
  REPO_VARS: ${{ toJSON(vars) }}   # the switches' repository variables (settings._switch; config/switches.toml)
  PDF_DATES_2DIGIT: ${{ vars.PDF_DATES_2DIGIT || '1' }}
  PDF_PAGE_RANK: ${{ vars.PDF_PAGE_RANK || '1' }}
  PDF_ROW_FIXES: ${{ vars.PDF_ROW_FIXES || '1' }}

jobs:
  run:
    if: inputs.command != 'pdf-referee-ensemble' && inputs.command != 'pdf-bench' && inputs.command != 'pdf-oos' && inputs.command != 'store-kept-pdfs' && inputs.command != 'api-reader-hardset' && inputs.command != 'api-reader-oos' && inputs.command != 'deck-pdfs' && inputs.command != 'seed-memory' && inputs.command != 'memory-gaps-fill' && inputs.command != 'screener-fill' && inputs.command != 'screener-fill-apply' && inputs.command != 'screener-download' && inputs.command != 'screener-schedules' && inputs.command != 'tijori-download' && inputs.command != 'text-backfill' && inputs.command != 'text-backfill-bse' && inputs.command != 'xbrl-facts'
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 330   # fill-memory's long steps; every other command takes minutes
    defaults:
      run:
        working-directory: pipeline
    env:
      FILE_CAP_MARKER_DIR: /tmp/file-cap-capped-${{ github.run_id }}-${{ github.run_attempt }}   # F213: a run that reached the file cap leaves a marker here
      FILE_CAP: ${{ inputs.file_cap || '0' }}   # F218: the input caps a test run (e.g. 100); 0 is no cap
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      DISCOVERY_SOURCE: nse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "${{ (inputs.command == 'pdf-referee' || inputs.command == 'pdf-referee-tijori') && '.[ocr]' || '.' }}"
      - name: Refresh card blocks
        if: inputs.command == 'refresh-card-blocks' || inputs.command == 'both'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        # a dry run also saves each changed card's blocks, before and after (artifact refresh-diff)
        run: |
          mkdir -p "$RUNNER_TEMP/refresh-diff"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel refresh-card-blocks ${{ inputs.dry_run && '--dry-run --diff-out "$RUNNER_TEMP/refresh-diff/refresh-diff.json"' || '' }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.command == 'refresh-card-blocks' || inputs.command == 'both') && inputs.dry_run
        with:
          name: refresh-diff
          path: ${{ runner.temp }}/refresh-diff/
          if-no-files-found: ignore
      - name: Restore from a backup
        if: inputs.command == 'restore'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          BACKUP: ${{ inputs.backup }}   # through the environment, never pasted into the script
          SCRIPS: ${{ inputs.scrips }}
          IDS: ${{ inputs.ids }}
          MODE: ${{ inputs.restore_mode }}   # a restore writes only on an explicit apply or apply-force; the default is a preview
        run: |
          if [ -z "$BACKUP" ]; then "$RUNNER_TEMP/venv/bin/python" -m bse_intel restore --list; exit 0; fi
          args=(--backup "$BACKUP")
          case "$MODE" in
            apply) args+=(--apply) ;;
            apply-force) args+=(--apply --force) ;;
          esac
          if [ "${IDS,,}" = all ]; then args+=(--all); elif [ -n "$IDS" ]; then args+=(--news-ids "$IDS"); fi
          if [ -n "$SCRIPS" ]; then args+=(--scrips "$SCRIPS"); fi
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel restore "${args[@]}"
