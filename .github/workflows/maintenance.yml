# No-AI maintenance on the live database, started by hand (Actions > Maintenance > Run workflow):
# - refresh-card-blocks: every stored card's code blocks rebuilt from memory by today's code (card_refresh.py);
# - refresh-summaries: every company's stored summary (open promises, radar, credibility) rebuilt from its memory;
# - restore: puts a backup (R2 backup/<job>-<time>/, saved before every write of refresh-card-blocks, label-memory-apply,
#   screener-fill-apply, memory-gaps-fill-bse --apply, memory-drop-known-wrong --apply and restated-pdf, and before a named seed-memory or requeue-failed --ids)
#   back for the named companies / cards, keeping what was written since (backup.py, restore.py; a requeue-failed --ids
#   backup has no after-state and needs apply-force). It writes only when `restore_mode` is apply or apply-force (default
#   preview); an empty `backup` lists the backups;
# - export-held: every held card into docs/audit/live/ on the working branch, for the live reviews (the public site
#   does not serve them);
# - export-critic: the shadow critic's verdicts of the last two days (R2 evidence/critic/) into docs/audit/live/, so the
#   daily audit can score its precision and recall (the audit's sessions read neither R2 nor the internal API);
# - requeue-failed: filings that used all 3 attempts in the last 30 days get fresh attempts (after a fix; requeue.py),
#   or, with ids, the named filings are re-run whatever their status (held or stale cards);
# - apply-verdicts: the owner's standing Wrong / Right verdicts applied to the stored cards once (verdicts saved
#   before they acted on the card, O11, never held or released it); a re-run keeps them by itself (cards_upsert.sql);
# - seed-memory: results history from NSE's XBRL into each universe company's memory, in twelve parallel shards (job
#   `seed`), each resuming after its last company; a pass is 5 h, and one that ends with companies left starts the next.
# - release-pruned: held cards whose only faults were points their quote did not carry, published without those points
#   (prune.py; owner, 2026-10-21: "Needs review · 475"); --dry-run counts them;
# - fill-memory: what the nightly run reads a few days of at a time, in one go (owner, 2026-10-21: "let it get filled
#   today ... except where AI is required"): shareholding patterns for the last `days` (two quarters at 110), governance
#   reports (two quarters), a year of pledge events, DGTR's case lists; then the seed passes start. Not the annual-report
#   catch-up: its XBRL feeds an AI re-run of the report.
# - memory-gaps: reads every universe company's memory (no NSE, no writes) and counts the quarters (last 8 past their
#   filing deadline) lacking an NSE-XBRL revenue or PAT, and whether the year-ago quarter of the latest is there; the JSON
#   and CSV go up as the artifact `memory-gaps`. memory-gaps-fill: the same, then the seed's results step for the companies
#   with gaps only, in four shards (job `gaps`, 5 h, resumes by itself: a company already tried is not tried again;
#   `restart` tries them all again), and the before / after counts. It reads NSE like seed-memory and shares its group,
#   so it never runs beside a seed pass; do not start it while a seed pass is queued (the group keeps one waiting run).
# - prune-companies: compares the companies table with NSE's equity list and SME list (no writes) and reports the rows to
#   remove by type (BSE-only equity, mutual fund / ETF, REIT / InvIT, SME) with the memory and ledger rows each holds, and
#   the rows kept because they hold cards or are starred; the JSON and CSV go up as the artifact `prune-companies`.
#   prune-companies-apply: the same, then writes a backup of every row it removes (and its memory file) to R2
#   backup/prune-companies-<date>.json, reads it back, and only then deletes the company rows with no cards and their
#   memory files (owner, 25 Oct 2026; F158). Run the dry run first and read it.
#   Kept since 26 Oct 2026 (owner, Option A): a BSE-only company with a stored market cap of 500 Cr or more is never removed
#   and is listed apart (`--bse-keep-min-mcap`, 0 = off).
# - bse-verify-kept: one-time, read-only (F160): for each kept BSE-only company, three paced calls a company through the ported BSE adapter
#   (stock-page header: status; trading panel: market cap; announcements filtered by the scrip, last 90 days); a refusal stops the run and
#   its body head goes in the file; JSON and CSV up as the artifact `bse-verify-kept`. Its group is the BSE one.
# - label-memory: reads every stored memory (and the cards' XBRL tables; no NSE, no writes) and counts what the one-off
#   labelling would give each item (file / ai / calc / unknown) per section; the JSON goes up as the artifact `label-memory`.
#   label-memory-apply: the same, then writes each changed memory back through the safe three-way merge, resuming after the
#   last company done (a second run only finishes what is left; exit 124 = run it again). No card changes (F150).
# - audit-precision: read-only on/off audit of the candidate number-matching rule (match at the precision the filing prints;
#   pipeline/scripts/audit_precision.py, docs/audit/precision-2026-10-26.md) over every stored card and its text in R2;
#   summary.json, lines.json and the blind-sample markdown go up as the artifact `audit-precision`. No writes.
# - release-check: read-only on/off comparison of the nine card switches that are built but off (CARD_EBITDA_PROFIT_V2,
#   CARD_SAME_DEFINITION, CARD_CONSOLIDATED_ONLY, CARD_TWO_PARTS, QUOTE_EXACT_NUMBERS, CARD_GROUNDED_FIGURES,
#   CARD_GUIDANCE_DATED, CARD_ONE_BASIS, MEMORY_YEAR_CHECK; the parts that cannot be replayed offline are listed, not faked; pipeline/scripts/release_check.py,
#   F170) over every stored card, its text in R2 and its company's memory, no AI. Per switch: what changed (cards, lines
#   added, removed, changed), a plain-text summary and a seeded blind sample of up to 20 changed cards with its key, all up
#   as the artifact `release-check`. No writes.
# - screener-fill: the one-time fill of the quarters memory lacks from screener.in (owner permission 26 Oct 2026; F161). A
#   dry run: one page per company with a gap (the page on memory's basis), at least 3 s between requests per runner, two
#   runners (job `screener`), a plain browser User-Agent, no login; nothing is written. The counts, the reasons skipped and
#   a CSV of every proposed fill with its overlap evidence go up as the artifacts `screener-fill-0` and `screener-fill-1`.
#   screener-fill-apply: the same, then writes the figures as by="screener" (dossier section screener_fill; no card reads
#   them unless MEMORY_SCREENER=1). A company already tried is not asked again; a run that ends on its time budget (exit
#   124) is started again by hand and resumes; `restart` tries them all again. screener.in refusing (exit 75) fails the shard.
# - screener-download: the one-time download of every company's two screener.in pages (owner permission 26 Oct 2026; F163,
#   TODO 50), raw and gzipped into R2 at raw/screener/<date>/<SYMBOL>_<c|s>.html.gz. Two runners (job `screener`), one request
#   per 3.2 s each, about 3,800 requests, about 1.7 hours on 2 shards; a page already stored for the date is not fetched
#   again; a run that ends on its time budget (exit 124) is started again and resumes; `restart` ignores the finished list;
#   screener.in refusing (403, 429, 503: exit 75) fails the shard. Its own concurrency group `screener`, so it runs beside the
#   NSE memory jobs: it touches no NSE call and no memory. Summary: artifacts `screener-download-0` and `screener-download-1`.
# - tijori-download: the download of every company's financials page from Tijori Finance (owner request 26 Oct 2026; F189, TODO 92),
#   gzipped JSON tables into R2 at raw/tijori/<date>/<SYMBOL>.json.gz. One runner (job `tijori`) for the whole universe: 8 threads
#   behind one shared limiter at TIJORI_RATE requests a second (default 6; about 1,900 pages, 5 to 6 minutes). The first refusal
#   (403, 429, 503, a challenge page) drops it to one request every 3 s and is recorded in the summary; a second one (exit 75)
#   fails the job. `limit` (input) = a trial on the first N companies; a page stored for the date is not fetched again; exit 124
#   leaves a marker and the command is started again. Its own concurrency group `maint-tijori`. No AI, no NSE, no memory
#   write. Summary: artifact `tijori-download`.
# - tijori-crosscheck: read only. Memory's exchange-file figures against the stored Tijori pages (no request) at Tijori's own
#   precision, and where the stored screener pages agree with Tijori against memory, those pairs as leads; summary.json,
#   crosscheck.csv and the markdown go up as the artifact `tijori-crosscheck`. Commits nothing. Group maint-ro-tijori-crosscheck.
# - text-backfill: the one-time download of the filing text for the stored cards that have none in R2 (owner 26 Oct 2026; F165,
#   TODO 51; the text cache `text/<news_id>.json.gz` only started on 25 Oct, so ~6,870 of 7,077 cards lack it). Fetches each
#   attachment from NSE as the pipeline does (same client, headers, 3-5 s pacing, ZIP handling, 120 MB cap), reads it with the
#   pipeline's own reader (local OCR on figure and scanned pages; input `no_ocr` skips it and those pages then keep their text
#   layer only) and writes the object through the pipeline's own cache bytes. Writes nothing else: no card, memory or filings
#   row. Two runners (job `textback`), the same NSE load as memory-gaps-fill; `limit` (input) = a trial on the first N cards. A
#   run that ends on its time budget (exit 124) leaves a marker and is started again (with a non-empty `then`, `chain` does
#   it); filings that failed (404, cut short, too large, ZIP audio) are kept with their reason and not tried again unless
#   `restart`; NSE refusing (exit 75) fails the shard. Summary: artifacts `text-backfill-0` and `text-backfill-1`.
# - text-backfill-bse: the same download for the cards whose file is on BSE (the older ones the NSE run lists as "not an NSE
#   file"; owner 26 Oct 2026, TODO 87), through the pipeline's own BSE client and its pace. One runner (job `textback-bse`),
#   group maint-bse, so it runs beside the NSE shards; BSE refusing (exit 75) fails it. Summary: artifact `text-backfill-bse`.
# - screener-crosscheck: read only. Memory's exchange-file figures against the stored screener pages (no screener request),
#   the cached official results text as referee (no download); summary.json, crosscheck.csv, referee.csv and the markdown
#   report go up as the artifact `screener-crosscheck`. Commits nothing.
# - xbrl-facts (owner, 28 Oct 2026: "save everything from XBRL"): every fact of each results XBRL file already stored in R2
#   (raw/xbrl/, F191) is kept as raw/xbrl-facts/<scrip>/<period>-<basis>.json.gz, outside the dossier, for the screener
#   cross-check's complete screener view; no NSE request. It lists the filings whose file is not stored (not-stored.csv, with
#   the url memory recorded) and, with `apply`, downloads those files through the seed's own fetch and pace, under `file_cap`
#   (the first run: 100; the cap is a planned stop, not a failure; a run with `apply` is refused without `file_cap`, and it shares the
#   NSE memory group `maint-nse-memory`, so it never runs beside a seed job's NSE traffic; `annual` also keeps each company's
#   annual-report XBRL, Ind AS only, as annual-<FY>-<basis>: one NSE list request a company, so it joins that group too, and a file is fetched only with `apply`). `ids` = companies, `limit` = the N largest
#   by market cap (as for screener-crosscheck), `dry_run` = parse and count, write nothing (with `apply`: list the files, download none). summary.json (what is stored, bytes a file, which levy, lease or treasury lines the files
#   carry) and not-stored.csv go up as the artifact `xbrl-facts`. Group maint-ro-xbrl-facts (`apply`: maint-nse-memory); writes nothing but raw/xbrl-facts/
#   (and raw/xbrl/ for a downloaded file); no memory, card or branch change. screener-crosscheck takes `ids` (companies) and
#   `limit` (the N largest by market cap) too.
# - tijori-referee: read only (owner 26 Oct 2026). The Tijori cross-check's revenue and profit leads (screener agrees with
#   Tijori against memory) and its sign differences, each looked up in NSE's results XBRL as screener-referee does; the CSV's
#   screener_value is Tijori's where screener has none. Artifact `tijori-referee`. Writes nothing.
# - screener-referee: read only. The cross-check worked out again (R2 and memory), then each disagreeing pair looked up in
#   NSE's own results XBRL (the period's file, else the next period's): one results list a company, each file once, the
#   archive host on its F169 pace, the API at 3-5 s. `limit` caps the pairs. referee-xbrl.csv, summary.json and the markdown
#   go up as the artifact `screener-referee`. Writes nothing to memory, cards or the branch.
#   With ids `archive` (F222, owner 27 Oct 2026): no results list at all. Each period's file name is read from memory (the
#   figure's `lab.file`, stamped by seed-memory from F222 on), the file comes from our XBRL store, else the archive host;
#   a pair with no name or file is not_run. Seed again first or most pairs are not_run.
# - pdf-referee: read only (owner 26 Oct 2026, TODO 61). The filing PDF as the last referee of the pairs `screener-referee`
#   left open (neither, no_file, screener_matches_official). The job downloads the newest unexpired `screener-referee`
#   artifact (gh api, the repository's own Actions artifacts), finds each pair's results PDF in NSE's announcements, reads it
#   with the pipeline's own reader (local OCR on figure pages) and keeps a figure only when its column, basis and unit are
#   proven (else pdf_unsure). `limit` caps the pairs. referee-pdf.csv, summary.json and the markdown go up as the artifact
#   `pdf-referee`. Writes nothing to memory, cards or the branch. No AI. F197: every 25 pairs or 3 minutes the decided pairs go to R2
#   (`meta/pdf-referee/<command>-<ids>-<run id>.csv`), because a lost runner kills the artifact upload; "Re-run failed jobs" of the same run skips them.
# - pdf-referee-ensemble: read only (owner 26 Oct 2026, F177; default off, `pdf-referee` itself is unchanged). The PDF referee with
#   several free local document readers that must agree. Three stages of jobs, each reader in a process and a job of its own
#   (a heavy reader is never loaded beside another; their dependencies conflict anyway): pdf-ensemble-fetch downloads the open
#   pairs' candidate PDFs once (NSE) and saves them with the referee CSV (`ids` = `tijori` takes the newest `tijori-referee`
#   artifact, else the newest `screener-referee`); pdf-ensemble-read is a matrix, one job a reader (camelot, pdfplumber, tabula,
#   rapidtable, tatr, docling, mineru, paddle, marker, surya), each installing only its own extra, caching its model weights
#   (actions/cache) and uploading its tables as the artifact `pdf-readings-<reader>`; pdf-ensemble-settle (the native reader
#   plus the files) applies the rule: a figure is settled only when its digits are in the page's text layer, two readers of two
#   different families agree on the row, period column and basis, and none differs (`pdf_disagree` otherwise; two OCR families
#   on a page with no text layer give `pdf_scanned_lead`). `limit` caps the company periods fetched. Every job logs the runner's
#   CPUs, RAM and free disk first. Artifact `pdf-referee-ensemble` (referee-pdf.csv with a `readers` column, summary.json,
#   markdown). Writes nothing to memory, cards or the branch. No AI. F199: `ids` = `hardset` reads docs/bench/hardpdf/key.csv (340
#   public NSE figures of 21 hard PDFs, the answer key) instead of a referee artifact: the fetch job downloads the key's own
#   pdf_url, the settle job asks every reader and the settle rule each key row and scores them (artifact `pdf-referee-ensemble`:
#   hardset-score.json / .md, hardset-readings.json): per reader and for the ensemble right / wrong / abstain, per difficulty
#   tag, and the ensemble's false settlements one by one. `limit` = the first N PDFs.
# - xbrl-key: read only (owner 28 Oct 2026). The exchange's XBRL figures that memory holds (revenue, other income, total income,
#   total expenses, exceptional items, PBT, tax, PAT, EPS, interest earned; both bases; every period of the filing's file) as a free
#   answer key for the PDF reader: each figure is located on its filing's PDF page by word position (pipeline/src/bse_intel/xbrl_key.py),
#   with its row label, its full column header path, its box and its failure stage when it is not found. The filing's PDF is
#   fetched as pdf-referee fetches it (same Sources, same archive pace, no new NSE path); no OCR (a scan is `no_text`). Companies
#   in a seeded shuffle, `limit` = filings (the first test is on 100 files: `file_cap` = 100), `ids` = only these companies (scrip
#   codes or symbols). xbrl-key.csv, summary.json and xbrl-key.md go up as the artifact `xbrl-key`, written every 10 filings or 3
#   minutes, and the rows also go to R2 (`meta/xbrl-key/xbrl-key[-<ids>].csv`: the name does not hold the run id, so a fresh
#   dispatch with the same `ids` continues the earlier run and skips the filings it finished; `restart` starts clean), so a run
#   stopped by its time budget, the file cap or a lost runner keeps what it did. A filing whose announcement list or download
#   failed is `fetch_failed`, never `not_found`, and is read again on the next dispatch. Writes nothing to memory, cards or the
#   branch. No AI.
# - screener-explain: read only (owner 26 Oct 2026). Of the `screener-referee` pairs where our figure equals NSE's own file,
#   which differences a later bonus, split or consolidation (the dossier's corporate actions) or a later results file
#   (memory's stored later-file source, else NSE's file) explains. The job takes the newest unexplained `screener-referee`
#   artifact like pdf-referee. explained.csv, summary.json and the markdown go up as the artifact `screener-explain`; its
#   `unexplained` rows are what `pdf-referee --explained` then reads. Writes nothing to memory, cards or the branch. No AI.
# - nse-speedtest: read only (F168, owner 26 Oct 2026). 100 seeded universe companies: their file links listed as the seed
#   lists them (timed), the all-company results list timed, then downloads from nsearchives only in rounds on different files
#   (A 3-5 s as today, B 1 s, C 0.3 s, D 0 s, E four workers at 0 s); a round stops at the first 403/429/503 or third timeout,
#   waits 60 s and no faster round follows. Writes nothing to D1, R2 or memory; artifact `nse-speedtest` (nse-speedtest.json).
# - call-memory: read only (F180, TODO 83, owner 26 Oct 2026). The call-memory reading (MEMORY_CALL_V2's step, call_memory.py) of the
#   filings named in `ids` (transcripts and decks, news ids): stored text and memory in, one AI call each on the free providers
#   (never DeepSeek), the checked points and every dropped point with its reason out. One <news_id>.json each and summary.json go up
#   as the artifact `call-memory`. Writes nothing to memory (the measurement run; --apply is for the laptop).
# - restated-pdf-trial: read only (F202, TODO 104). restated-pdf --dry-run: the latest six quarters' results PDFs of the companies
#   in `ids` (or the first `limit` of the universe), text layer only, and every comparative that differs from memory's original
#   listed with both figures and their sources (artifact `restated-pdf-trial`). Writes nothing; storing waits for its review.
# - memory-gaps-fill-bse: the one-time fill (F201, TODO 100, owner 27 Oct 2026) of the results quarters memory lacks for companies
#   whose NSE results list is empty (listed on NSE in 2026, earlier quarters on BSE only), from BSE's results XBRL through the seed's
#   BSE path, for companies at the universe's market-cap floor (500 Cr) or more. NSE's list is read at run time; a figure memory
#   already holds is never overwritten; each figure written carries exchange BSE and the file's address. A dry run unless the
#   input `apply` is set (the summary, a CSV of every figure and the log go up as the artifact `memory-gaps-fill-bse`). `restart`
#   tries the companies an earlier apply run handled. The daily pipeline stays NSE only. Group maint-nse-memory.
# - memory-drop-known-wrong: takes the figures on the code-held known-wrong list (known_wrong.py, F223: the exchange's own file differs
#   from the company's own results statement; each with its evidence) out of the stored dossiers, no AI and no exchange. A dry run unless
#   the input `apply` is set; `ids` names listed companies (scrip codes), empty means every listed one. Each dossier is backed up
#   (R2 backup/memory-drop-known-wrong-<time>/, before and after) before it is written, so `restore` undoes it. A stored figure goes only
#   when its metric, period, basis and value are the listed ones. The report goes up as the artifact `memory-drop-known-wrong`. Group
#   maint-nse-memory (it writes memory, so it never runs beside a seed).
# None calls an AI model; seed-memory, memory-gaps-fill and fill-memory read NSE. It runs beside the pipeline (its own concurrency group:
# a shared one would cancel a pending pipeline run); fill-memory pauses the AI pipeline while it writes memory.
# CONCURRENCY GROUPS (owner, 26 Oct 2026; F164). Jobs wait in the group of their SOURCE and what they WRITE, so jobs on
# different sources run side by side, and two jobs that write the same store never run together. cancel-in-progress is
# false and a group keeps one waiting run (a newer one replaces the waiting one): do not queue two commands of one group.
#   group              commands
#   maint-nse-memory   everything that reads NSE or writes memory: seed-memory, memory-gaps-fill, memory-gaps-fill-bse, memory-drop-known-wrong, fill-memory, fill-trades,
#                      label-memory-apply, screener-fill-apply, prune-companies-apply (writes memory and companies),
#                      text-backfill (reads NSE; writes only text/ objects)
#   maint-cards        writes cards in D1 (or commits to the branch): refresh-card-blocks, refresh-summaries, both,
#                      requeue-failed, apply-verdicts, release-pruned, export-held, export-critic, restore (puts a backup of
#                      cards and memory back; it can overlap a memory job, so do not run it beside one)
#   maint-bse          probe-bse, bse-results-test, bse-verify-kept, text-backfill-bse (reads BSE; writes only text/ objects)
#   maint-screener     screener-download, screener-fill (the dry run reads screener.in)
#   maint-tijori       tijori-download (reads tijorifinance.com; writes only raw/tijori/ objects)
#   maint-ro-<command> read-only, one group per command (so each runs beside everything else, never beside itself):
#                      failed-report, memory-gaps (memory only), label-memory, prune-companies (compares the companies table
#                      with NSE's lists, writes nothing), audit-precision, release-check, screener-crosscheck (R2 and memory), xbrl-facts (R2 and memory; writes only raw/xbrl-facts/ in R2; a run with `apply` downloads NSE files and is in the NSE memory group), tijori-crosscheck (R2 and memory; writes nothing), tijori-referee (R2, memory and NSE; writes nothing), screener-referee (R2, memory and NSE; writes nothing), pdf-referee (the referee CSV and NSE; writes nothing), xbrl-key (R2, memory and NSE; writes nothing), screener-explain (the referee CSV, memory and NSE; writes nothing), restated-report (memory only), restated-pdf-trial (memory and NSE; writes nothing), memory-recall-export (R2 and memory; writes nothing), nse-selfcheck (memory only), prediction-units (memory only), nse-speedtest (reads NSE; writes nothing), call-memory (R2, memory and the free AI providers; writes nothing)
# A command in no list falls into maint-cards; add a new command to the right list in `concurrency.group` below.
#
# CHAINING: the input `then` is a comma-separated list of commands, each optionally `command:restart` (passes restart=true),
# e.g. command=memory-gaps-fill, then="seed-memory:restart,label-memory". When the run's work has succeeded, the final job
# `chain` dispatches the first command of `then` with `then` = the rest (gh workflow run, same ref). It does not fire when any
# job failed or was cancelled. Commands that resume themselves are chained only when FINISHED:
#   - seed-memory (seed-next) and memory-gaps-fill (gaps-next) start the next pass while any shard timed out (exit 124) and
#     pass `then` along on that re-dispatch; the pass that finds nothing left lets `chain` run the first of `then`;
#   - screener-download, screener-fill, screener-fill-apply, tijori-download, text-backfill and label-memory-apply (exit 124 = resume) leave a marker
#     artifact (`*-more-*`) when time ran out; with a non-empty `then`, `chain` then re-dispatches the same command with the
#     same `then` (restart=false) instead of the next one; with `then` empty they stay manual, as before;
#   - fill-memory starts its own seed-memory passes at its end and hands `then` to them; `chain` does nothing for it.
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      command:
        description: what to run
        type: choice
        options: [refresh-card-blocks, refresh-summaries, both, export-held, export-critic, requeue-failed, failed-report, probe-bse, bse-results-test, bse-verify-kept, apply-verdicts, seed-memory, fill-memory, fill-trades, release-pruned, memory-gaps, memory-gaps-fill, memory-gaps-fill-bse, memory-drop-known-wrong, prune-companies, prune-companies-apply, label-memory, label-memory-apply, audit-precision, release-check, screener-fill, screener-fill-apply, screener-download, screener-crosscheck, xbrl-facts, screener-referee, screener-explain, pdf-referee, xbrl-key, pdf-referee-ensemble, tijori-download, tijori-crosscheck, tijori-referee, pdf-referee-tijori, text-backfill, text-backfill-bse, restated-report, restated-pdf-trial, memory-recall-export, nse-selfcheck, prediction-units, nse-speedtest, call-memory, restore]
        default: both
      backup:
        description: restore only - the backup's R2 prefix (backup/<job>-<time>/); empty lists the backups. Needs `scrips` or `ids` (the cards' news ids) to name what goes back, or `all` in `ids`
        type: string
        default: ''
      scrips:
        description: restore only - put back these companies' memory and cards (scrip codes, comma separated)
        type: string
        default: ''
      restore_mode:
        description: restore only - preview (default; writes nothing), apply (puts back what the job changed and nobody has changed since), apply-force (also what was changed since; and a backup with no after-state, which is every requeue-failed --ids backup)
        type: choice
        options: [preview, apply, apply-force]
        default: preview
      ids:
        description: screener-crosscheck and xbrl-facts - only these companies (scrip codes or NSE symbols, comma separated); restore - the cards to put back (news ids, comma separated), or `all` for everything in the backup; requeue-failed - re-run these filings instead; call-memory - the transcripts and decks to read (news ids, comma separated); xbrl-key - only these companies (scrip codes or NSE symbols, comma separated); memory-drop-known-wrong - only these listed companies (scrip codes); pdf-referee-ensemble - `tijori` reads the tijori-referee artifact instead of the screener-referee one; `hardset` reads the answer key docs/bench/hardpdf/key.csv and scores every reader against it; pdf-referee - `explained` reads the screener-explain artifact (its unexplained rows); screener-referee - `archive` reads the file names memory holds and the archive host only (no results list); seed-memory - re-read only these companies (scrip codes or NSE symbols); restated-pdf-trial - only these companies
        type: string
        default: ''
      since:
        description: requeue-failed only - failed filings filed on or after this date (YYYY-MM-DD); default the last 30 days
        type: string
        default: ''
      restart:
        description: seed-memory only - start again from the first company; memory-gaps-fill - try the companies an earlier pass tried; xbrl-key - ignore the rows an earlier run saved and start clean
        type: boolean
        default: false
      days:
        description: fill-memory only - days of NSE's shareholding list to read (110 covers the last two quarters)
        type: string
        default: '110'
      limit:
        description: screener-crosscheck and xbrl-facts - only the N largest companies by market cap (of `ids`, else of the universe); text-backfill - a trial on the first N cards lacking text; screener-referee and pdf-referee - at most N pairs refereed (empty = all); xbrl-key - at most N filings read (empty = all); memory-recall-export - filings in the sample (empty = 20); restated-pdf-trial - at most N companies
        type: string
        default: ''
      no_ocr:
        description: text-backfill and pdf-referee - skip local OCR (text layer only; pdf-referee then counts only text-layer readings)
        type: boolean
        default: false
      sample:
        description: pdf-referee only - instead of the open pairs, a random sample of N pairs where memory equals NSE's file (tests the file against its PDF)
        type: string
        default: ''
      then:
        description: commands to run after this one succeeds, comma separated; name:restart passes restart=true (see the header)
        type: string
        default: ''
      apply:
        description: memory-gaps-fill-bse and memory-drop-known-wrong only - write (the figures labelled BSE; the listed figures taken out, after a backup); without it a dry run that writes nothing; xbrl-facts - also download the files that are not stored (NSE, the seed's fetch and pace, counts toward file_cap, which is required, the first run is 100)
        type: boolean
        default: false
      dry_run:
        description: count what would change, write nothing (refresh-card-blocks, requeue-failed, release-pruned, xbrl-facts)
        type: boolean
        default: false
      min_mcap_cr:
        description: memory-gaps-fill-bse only - fill only companies with at least this market cap (Rs Cr); empty means the universe's 500
        type: string
        default: ''
      annual:
        description: xbrl-facts only - also keep the annual-report XBRL (Ind AS only, never BRSR, the latest 3 years a basis), one NSE list request a company, so the run joins the NSE memory group; a file not stored is fetched only with apply
        type: boolean
        default: false
      file_cap:
        description: a test run's cap on NSE/BSE files (owner, 27 Oct 2026, the first test of a fetch is 100 files); empty means no cap
        type: string
        default: ''

permissions:
  contents: write   # export-held commits its file to the working branch; the other commands only read the repository
  actions: write    # seed-memory starts its next pass (workflow_dispatch) while companies are left

concurrency:
  # groups by source and by what a job writes: the table in the header comment (a downloading xbrl-facts run is NSE traffic: the NSE memory group)
  group: >-
    ${{ contains(fromJSON('["seed-memory","memory-gaps-fill","memory-gaps-fill-bse","memory-drop-known-wrong","fill-memory","fill-trades","label-memory-apply","screener-fill-apply","prune-companies-apply","text-backfill"]'), inputs.command) && 'maint-nse-memory'
    || (inputs.command == 'xbrl-facts' && (inputs.apply || inputs.annual)) && 'maint-nse-memory'
    || contains(fromJSON('["refresh-card-blocks","refresh-summaries","both","requeue-failed","apply-verdicts","release-pruned","export-held","export-critic","restore"]'), inputs.command) && 'maint-cards'
    || contains(fromJSON('["probe-bse","bse-results-test","bse-verify-kept","text-backfill-bse"]'), inputs.command) && 'maint-bse'
    || contains(fromJSON('["screener-download","screener-fill"]'), inputs.command) && 'maint-screener'
    || inputs.command == 'tijori-download' && 'maint-tijori'
    || contains(fromJSON('["failed-report","memory-gaps","label-memory","prune-companies","audit-precision","release-check","screener-crosscheck","xbrl-facts","tijori-crosscheck","tijori-referee","screener-referee","screener-explain","pdf-referee","xbrl-key","pdf-referee-tijori","pdf-referee-ensemble","restated-report","restated-pdf-trial","memory-recall-export","nse-selfcheck","prediction-units","nse-speedtest","call-memory"]'), inputs.command) && format('maint-ro-{0}', inputs.command)
    || 'maint-cards' }}
  cancel-in-progress: false

# F215 (owner 27 Oct: merge and switch on once reviewed): the PDF referee and reader paths read two-digit years, rank pages and
# take the profit total; maintenance only. The live pipeline keeps them off: its restated-YoY and unit-slip checks share this
# code and need the on/off over stored cards first (review of e559bcb). A repository variable set to 0 turns one off.
env:
  REPO_VARS: ${{ toJSON(vars) }}   # the switches' repository variables (settings._switch; config/switches.toml)
  PDF_DATES_2DIGIT: ${{ vars.PDF_DATES_2DIGIT || '1' }}
  PDF_PAGE_RANK: ${{ vars.PDF_PAGE_RANK || '1' }}
  PDF_ROW_FIXES: ${{ vars.PDF_ROW_FIXES || '1' }}

jobs:
  run:
    if: inputs.command != 'pdf-referee-ensemble' && inputs.command != 'seed-memory' && inputs.command != 'memory-gaps-fill' && inputs.command != 'screener-fill' && inputs.command != 'screener-fill-apply' && inputs.command != 'screener-download' && inputs.command != 'tijori-download' && inputs.command != 'text-backfill' && inputs.command != 'text-backfill-bse'
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 330   # fill-memory's long steps; every other command takes minutes
    defaults:
      run:
        working-directory: pipeline
    env:
      FILE_CAP_MARKER_DIR: /tmp/file-cap-capped-${{ github.run_id }}-${{ github.run_attempt }}   # F213: a run that reached the file cap leaves a marker here
      FILE_CAP: ${{ inputs.file_cap || '0' }}   # F218: the input caps a test run (e.g. 100); 0 is no cap
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      DISCOVERY_SOURCE: nse
    steps:
      - name: Refuse an xbrl-facts download without a file cap
        if: inputs.command == 'xbrl-facts' && inputs.apply && (inputs.file_cap == '' || inputs.file_cap == '0')
        run: |
          echo "::error::xbrl-facts with apply downloads NSE files: give file_cap (the first test of a fetch is 100 files, owner 27 Oct 2026)"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "${{ (inputs.command == 'pdf-referee' || inputs.command == 'pdf-referee-tijori') && '.[ocr]' || '.' }}"
      - name: Refresh card blocks
        if: inputs.command == 'refresh-card-blocks' || inputs.command == 'both'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        # a dry run also saves each changed card's blocks, before and after (artifact refresh-diff)
        run: |
          mkdir -p "$RUNNER_TEMP/refresh-diff"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel refresh-card-blocks ${{ inputs.dry_run && '--dry-run --diff-out "$RUNNER_TEMP/refresh-diff/refresh-diff.json"' || '' }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.command == 'refresh-card-blocks' || inputs.command == 'both') && inputs.dry_run
        with:
          name: refresh-diff
          path: ${{ runner.temp }}/refresh-diff/
          if-no-files-found: ignore
      - name: Restore from a backup
        if: inputs.command == 'restore'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          BACKUP: ${{ inputs.backup }}   # through the environment, never pasted into the script
          SCRIPS: ${{ inputs.scrips }}
          IDS: ${{ inputs.ids }}
          MODE: ${{ inputs.restore_mode }}   # a restore writes only on an explicit apply or apply-force; the default is a preview
        run: |
          if [ -z "$BACKUP" ]; then "$RUNNER_TEMP/venv/bin/python" -m bse_intel restore --list; exit 0; fi
          args=(--backup "$BACKUP")
          case "$MODE" in
            apply) args+=(--apply) ;;
            apply-force) args+=(--apply --force) ;;
          esac
          if [ "${IDS,,}" = all ]; then args+=(--all); elif [ -n "$IDS" ]; then args+=(--news-ids "$IDS"); fi
          if [ -n "$SCRIPS" ]; then args+=(--scrips "$SCRIPS"); fi
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel restore "${args[@]}"
      - name: Refresh company summaries
        if: (inputs.command == 'refresh-summaries' || inputs.command == 'both') && !inputs.dry_run
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel refresh-summaries'
      - name: Requeue failed filings
        if: inputs.command == 'requeue-failed'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          IDS: ${{ inputs.ids }}   # through the environment, never pasted into the script
          SINCE: ${{ inputs.since }}
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel requeue-failed ${IDS:+--ids "$IDS"} ${SINCE:+--since "$SINCE"} ${{ inputs.dry_run && ''--dry-run'' || '''' }}'
      # owner, 25 Oct 2026: can GitHub's machines reach BSE at all? (reads three public BSE addresses; no AI, no writes)
      - name: Probe BSE from GitHub
        if: inputs.command == 'probe-bse'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        working-directory: .
        run: |
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "runner country: $(curl -s --max-time 10 https://ipinfo.io/country)"
          for u in "https://www.bseindia.com/" \
                   "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=-1&strPrevDate=20261023&strScrip=&strSearch=P&strToDate=20261023&strType=C&subcategory=-1" \
                   "https://api.bseindia.com/BseIndiaAPI/api/Result_Arch_ng/w?scripcode=500325"; do
            # the headers BSE's own pages send (adapters/bse.py); without Origin and Sec-Fetch-Site the API answers 403
            curl -s -A "$ua" -H "Referer: https://www.bseindia.com/" -H "Origin: https://www.bseindia.com" \
                 -H "Accept: application/json, text/plain, */*" -H "Accept-Language: en-US,en;q=0.5" -H "Sec-Fetch-Site: same-site" \
                 --max-time 25 -o /tmp/b.out -w "%{http_code} %{size_download} $u\n" "$u" || echo "failed $u"
            head -c 150 /tmp/b.out; echo
          done
      - name: BSE results through the adapter (reads only)
        if: inputs.command == 'bse-results-test'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install -q "requests>=2.31"
          mkdir -p "$RUNNER_TEMP/bsetest"
          "$RUNNER_TEMP/venv/bin/python" scripts/bse_results_test.py "$RUNNER_TEMP/bsetest/bse_results.json"
        env:
          BSE_TEST_COS: ${{ inputs.ids }}   # scrip:symbol pairs, comma separated; empty = the 8 companies of 25 Oct
          SAVE_DIR: ${{ runner.temp }}/bsetest
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'bse-results-test'
        with:
          name: bse-results-test
          path: ${{ runner.temp }}/bsetest/
          if-no-files-found: ignore
      - name: BSE check of the kept BSE-only companies (reads only)
        if: inputs.command == 'bse-verify-kept'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
        run: |
          code=0
          "$RUNNER_TEMP/venv/bin/pip" install -q "requests>=2.31"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel bse-verify-kept --json "$RUNNER_TEMP/bse-verify-kept.json" --csv "$RUNNER_TEMP/bse-verify-kept.csv" || code=$?
          mkdir -p "$RUNNER_TEMP/bsekept" && cp "$RUNNER_TEMP"/bse-verify-kept.* "$RUNNER_TEMP/bsekept/" || true
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'bse-verify-kept'
        with:
          name: bse-verify-kept
          path: ${{ runner.temp }}/bsekept/
          if-no-files-found: ignore
      - name: Memory gaps from BSE (NSE-empty companies)
        if: inputs.command == 'memory-gaps-fill-bse'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          APPLY: ${{ inputs.apply }}     # through the environment, never pasted into the script
          RESTART: ${{ inputs.restart }}
          # F214 (TODO 108; owner 27 Oct: merge and switch on once reviewed): also the quarters older than a company's first
          # NSE results row. A repository variable BSE_FILL_PRE_NSE=0 turns it off.
          BSE_FILL_PRE_NSE: ${{ vars.BSE_FILL_PRE_NSE || '1' }}
          # a test on bigger companies (owner, 27 Oct 2026): the fill's market-cap floor for this run only; the universe file
          # it reads is not rebuilt here, so nothing else changes
          UNIVERSE_MIN_MCAP_CR: ${{ inputs.min_mcap_cr || vars.UNIVERSE_MIN_MCAP_CR || '500' }}
        run: |
          # a dry run unless `apply`: it reads NSE and BSE and writes nothing to memory
          set -o pipefail
          code=0
          mkdir -p "$RUNNER_TEMP/gapsbse"
          flags=""
          [ "$APPLY" = "true" ] && flags="$flags --apply"
          [ "$RESTART" = "true" ] && flags="$flags --restart"
          # F218: the fill reads BSE through the ported adapter, which uses requests (the `bse` extra), as bse-results-test
          "$RUNNER_TEMP/venv/bin/pip" install -q "requests>=2.31"
          timeout 300m "$RUNNER_TEMP/venv/bin/python" -m bse_intel memory-gaps-fill-bse --time-budget 17400 $flags --json "$RUNNER_TEMP/gapsbse/memory-gaps-fill-bse.json" --csv "$RUNNER_TEMP/gapsbse/memory-gaps-fill-bse.csv" | tee "$RUNNER_TEMP/gapsbse/memory-gaps-fill-bse.txt" || code=$?
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'memory-gaps-fill-bse'
        with:
          name: memory-gaps-fill-bse
          path: ${{ runner.temp }}/gapsbse/
          if-no-files-found: ignore
      - name: Drop the known-wrong figures from memory (a dry run unless apply)
        if: inputs.command == 'memory-drop-known-wrong'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
          APPLY: ${{ inputs.apply }}     # through the environment, never pasted into the script
          IDS: ${{ inputs.ids }}
        run: |
          # a dry run unless `apply`: each changed dossier is backed up to R2 backup/ before it is written (backup.RunBackup)
          set -o pipefail
          code=0
          mkdir -p "$RUNNER_TEMP/knownwrong"
          args=(--json "$RUNNER_TEMP/knownwrong/memory-drop-known-wrong.json")
          [ "$APPLY" = "true" ] && args+=(--apply)
          if [ -n "$IDS" ]; then args+=(--scrips "$IDS"); fi
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel memory-drop-known-wrong "${args[@]}" | tee "$RUNNER_TEMP/knownwrong/memory-drop-known-wrong.txt" || code=$?
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'memory-drop-known-wrong'
        with:
          name: memory-drop-known-wrong
          path: ${{ runner.temp }}/knownwrong/
          if-no-files-found: ignore
      - name: Memory gaps (reads only)
        if: inputs.command == 'memory-gaps'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
        run: |
          code=0
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel memory-gaps --json "$RUNNER_TEMP/memory-gaps.json" --csv "$RUNNER_TEMP/memory-gaps.csv" || code=$?
          mkdir -p "$RUNNER_TEMP/gaps" && cp "$RUNNER_TEMP"/memory-gaps.* "$RUNNER_TEMP/gaps/" || true
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'memory-gaps'
        with:
          name: memory-gaps
          path: ${{ runner.temp }}/gaps/
          if-no-files-found: ignore
      - name: Restated report (reads only)
        if: inputs.command == 'restated-report'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
        run: |
          mkdir -p "$RUNNER_TEMP/restated"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel restated-report --json "$RUNNER_TEMP/restated/restated-report.json"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'restated-report'
        with:
          name: restated-report
          path: ${{ runner.temp }}/restated/
          if-no-files-found: ignore
      - name: Restated PDF trial (reads only; F202)
        if: inputs.command == 'restated-pdf-trial'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
          IDS: ${{ inputs.ids }}
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p "$RUNNER_TEMP/restated"
          args=(--dry-run --json "$RUNNER_TEMP/restated/restated-pdf-trial.json")
          if [ -n "$IDS" ]; then args+=(--scrips "$IDS"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel restated-pdf "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'restated-pdf-trial'
        with:
          name: restated-pdf-trial
          path: ${{ runner.temp }}/restated/
          if-no-files-found: ignore
      - name: Memory recall export (reads only)
        if: inputs.command == 'memory-recall-export'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p "$RUNNER_TEMP/recall"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel memory-recall-export --out "$RUNNER_TEMP/recall" --limit "${LIMIT:-20}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'memory-recall-export'
        with:
          name: memory-recall-export
          path: ${{ runner.temp }}/recall/
          if-no-files-found: ignore
      - name: NSE self-check (reads only)
        if: inputs.command == 'nse-selfcheck'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
        run: |
          mkdir -p "$RUNNER_TEMP/selfcheck"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel nse-selfcheck --json "$RUNNER_TEMP/selfcheck/nse-selfcheck.json" --csv "$RUNNER_TEMP/selfcheck/nse-selfcheck.csv" --referee-csv "$RUNNER_TEMP/selfcheck/nse-selfcheck-referee.csv"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'nse-selfcheck'
        with:
          name: nse-selfcheck
          path: ${{ runner.temp }}/selfcheck/
          if-no-files-found: ignore
      - name: Prediction units (reads only)
        if: inputs.command == 'prediction-units'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
        run: |
          mkdir -p "$RUNNER_TEMP/predunits"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel prediction-units --json "$RUNNER_TEMP/predunits/prediction-units.json"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'prediction-units'
        with:
          name: prediction-units
          path: ${{ runner.temp }}/predunits/
          if-no-files-found: ignore
      - name: Call memory (reads only; free AI providers)
        if: inputs.command == 'call-memory'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
          IDS: ${{ inputs.ids }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}   # call memory only (providers.gemini_3, only_routes)
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/callmem"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel call-memory --ids "$IDS" --out "$RUNNER_TEMP/callmem"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.command == 'call-memory'
        with:
          name: call-memory
          path: ${{ runner.temp }}/callmem/
          if-no-files-found: ignore
      - name: Prune companies (dry run, reads only)
        if: inputs.command == 'prune-companies'
        timeout-minutes: 305   # F216: a step that overruns ends here, so the upload step below still runs
        env:
          PLATFORM_TIMEOUT_S: "30"   # F216
          PLATFORM_ATTEMPTS: "3"
        run: |
          code=0
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel prune-companies --json "$RUNNER_TEMP/prune-companies.json" --csv "$RUNNER_TEMP/prune-companies.csv" || code=$?
          mkdir -p "$RUNNER_TEMP/prune" && cp "$RUNNER_TEMP"/prune-companies.* "$RUNNER_TEMP/prune/" || true
          exit "$code"
      - name: Prune companies (backup to R2, then remove)
        if: inputs.command == 'prune-companies-apply'
