# No-AI maintenance on the live database, started by hand (Actions > Maintenance > Run workflow):
# - refresh-card-blocks: every stored card's code blocks rebuilt from memory by today's code (card_refresh.py);
# - refresh-summaries: every company's stored summary (open promises, radar, credibility) rebuilt from its memory;
# - export-held: every held card into docs/audit/live/ on the working branch, for the live reviews (the public site
#   does not serve them);
# - requeue-failed: filings that used all 3 attempts in the last 30 days get fresh attempts (after a fix; requeue.py),
#   or, with ids, the named filings are re-run whatever their status (held or stale cards);
# - apply-verdicts: the owner's standing Wrong / Right verdicts applied to the stored cards once (verdicts saved
#   before they acted on the card, O11, never held or released it); a re-run keeps them by itself (cards_upsert.sql);
# - seed-memory: results history from NSE's XBRL into each universe company's memory (T13's re-seed on the basis
#   fix), resuming after the last company finished; 5 h a pass, and a pass that runs out of time with companies left
#   starts the next one itself. It reads NSE beside the live runs, so no pass starts itself in market hours
#   (02:30-10:30 UTC = 08:00-16:00 IST): then dispatch it again after the close.
# Neither calls an AI model or NSE. It runs beside the pipeline (its own concurrency group: a shared one would
# cancel a pending pipeline run); both only read memory, and a summary or card a run writes at the same moment is
# rewritten by the next run.
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      command:
        description: what to run
        type: choice
        options: [refresh-card-blocks, refresh-summaries, both, export-held, requeue-failed, apply-verdicts, seed-memory]
        default: both
      ids:
        description: requeue-failed only - re-run these filings instead (news ids, comma separated)
        type: string
        default: ''
      restart:
        description: seed-memory only - start again from the first company
        type: boolean
        default: false
      dry_run:
        description: count what would change, write nothing (refresh-card-blocks, requeue-failed)
        type: boolean
        default: false

permissions:
  contents: write   # export-held commits its file to the working branch; the other commands only read the repository
  actions: write    # seed-memory starts its next pass (workflow_dispatch) while companies are left

concurrency:
  group: bse-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 330   # seed-memory's long step; every other command takes minutes
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      DISCOVERY_SOURCE: nse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "."
      - name: Refresh card blocks
        if: inputs.command == 'refresh-card-blocks' || inputs.command == 'both'
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel refresh-card-blocks ${{ inputs.dry_run && ''--dry-run'' || '''' }}'
      - name: Refresh company summaries
        if: (inputs.command == 'refresh-summaries' || inputs.command == 'both') && !inputs.dry_run
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel refresh-summaries'
      - name: Requeue failed filings
        if: inputs.command == 'requeue-failed'
        env:
          IDS: ${{ inputs.ids }}   # through the environment, never pasted into the script
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel requeue-failed ${IDS:+--ids "$IDS"} ${{ inputs.dry_run && ''--dry-run'' || '''' }}'
      - name: Apply the owner's verdicts
        if: inputs.command == 'apply-verdicts' && !inputs.dry_run
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel apply-verdicts'
      - name: Seed memory from NSE's results XBRL
        id: seed
        if: inputs.command == 'seed-memory'
        # stopped a little before the job's limit; the next pass resumes after the last company finished. 20 Oct
        # 2026: 63 companies in 45 min (~7.5 s an XBRL file), so the universe's 608 need about 7 h: 5 h a pass.
        # Only the timeout means companies are left: the command ends by itself when the universe is done, and when
        # NSE refuses the session (no next pass then, so a refusal is never pressed on).
        run: |
          code=0
          timeout 300m "$RUNNER_TEMP/venv/bin/python" -m bse_intel seed-memory --universe --results-only ${{ inputs.restart && '--restart' || '' }} || code=$?
          if [ "$code" -eq 124 ]; then echo "more=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Start the next seed-memory pass
        if: steps.seed.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -ge 0230 ] && [ "$now" -lt 1030 ]; then
            echo "market hours (IST): no pass starts now; dispatch seed-memory again after the close"
          else
            gh workflow run maintenance.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f command=seed-memory -f restart=false
            echo "next pass started"
          fi
      - name: Export held cards
        if: inputs.command == 'export-held'
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel export-held --out "../docs/audit/live/held-$(date -u +%F).json"'
      # into the working branch, as T19 planned (the owner accepted held drafts in the public repository, 2026-10-20)
      - name: Commit the export
        if: inputs.command == 'export-held'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin claude/nice-goodall-ta0sxs
          git checkout -q -B claude/nice-goodall-ta0sxs origin/claude/nice-goodall-ta0sxs
          git add docs/audit/live/held-*.json
          git commit -qm "Held cards exported for the live review (maintenance.yml export-held)"
          git push -q origin claude/nice-goodall-ta0sxs
