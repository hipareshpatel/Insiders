# No-AI maintenance on the live database, started by hand (Actions > Maintenance > Run workflow):
# - refresh-card-blocks: every stored card's code blocks rebuilt from memory by today's code (card_refresh.py);
# - refresh-summaries: every company's stored summary (open promises, radar, credibility) rebuilt from its memory;
# - restore: puts a backup (R2 backup/<job>-<time>/, saved before every write of refresh-card-blocks, label-memory-apply,
#   screener-fill-apply, memory-gaps-fill-bse --apply, memory-drop-known-wrong --apply, memory-rerank --apply, statements-correct --apply and restated-pdf, and before a named seed-memory or requeue-failed --ids)
#   back for the named companies / cards, keeping what was written since (backup.py, restore.py; a requeue-failed --ids
#   backup has no after-state and needs apply-force). It writes only when `restore_mode` is apply or apply-force (default
#   preview); an empty `backup` lists the backups;
# - export-held: every held card into docs/audit/live/ on the working branch, for the live reviews (the public site
#   does not serve them);
# - export-critic: the shadow critic's verdicts of the last two days (R2 evidence/critic/) into docs/audit/live/, so the
#   daily audit can score its precision and recall (the audit's sessions read neither R2 nor the internal API);
# - requeue-failed: filings that used all 3 attempts in the last 30 days get fresh attempts (after a fix; requeue.py),
#   or, with ids, the named filings are re-run whatever their status (held or stale cards);
# - apply-verdicts: the owner's standing Wrong / Right verdicts applied to the stored cards once (verdicts saved
#   before they acted on the card, O11, never held or released it); a re-run keeps them by itself (cards_upsert.sql);
# - seed-memory: results history from NSE's XBRL into each universe company's memory, in twelve parallel shards (job
#   `seed`), each resuming after its last company; a pass is 5 h, and one that ends with companies left starts the next.
# - release-pruned: held cards whose only faults were points their quote did not carry, published without those points
#   (prune.py; owner, 2026-10-21: "Needs review · 475"); --dry-run counts them;
# - fill-memory: what the nightly run reads a few days of at a time, in one go (owner, 2026-10-21: "let it get filled
#   today ... except where AI is required"): shareholding patterns for the last `days` (two quarters at 110), governance
#   reports (two quarters), a year of pledge events, DGTR's case lists; then the seed passes start. Not the annual-report
#   catch-up: its XBRL feeds an AI re-run of the report.
# - memory-gaps: reads every universe company's memory (no NSE, no writes) and counts the quarters (last 8 past their
#   filing deadline) lacking an NSE-XBRL revenue or PAT, and whether the year-ago quarter of the latest is there; the JSON
#   and CSV go up as the artifact `memory-gaps`. memory-gaps-fill: the same, then the seed's results step for the companies
#   with gaps only, in four shards (job `gaps`, 5 h, resumes by itself: a company already tried is not tried again;
#   `restart` tries them all again), and the before / after counts. It reads NSE like seed-memory and shares its group,
#   so it never runs beside a seed pass; do not start it while a seed pass is queued (the group keeps one waiting run).
# - prune-companies: compares the companies table with NSE's equity list and SME list (no writes) and reports the rows to
#   remove by type (BSE-only equity, mutual fund / ETF, REIT / InvIT, SME) with the memory and ledger rows each holds, and
#   the rows kept because they hold cards or are starred; the JSON and CSV go up as the artifact `prune-companies`.
#   prune-companies-apply: the same, then writes a backup of every row it removes (and its memory file) to R2
#   backup/prune-companies-<date>.json, reads it back, and only then deletes the company rows with no cards and their
#   memory files (owner, 25 Oct 2026; F158). Run the dry run first and read it.
#   Kept since 26 Oct 2026 (owner, Option A): a BSE-only company with a stored market cap of 500 Cr or more is never removed
#   and is listed apart (`--bse-keep-min-mcap`, 0 = off).
# - bse-verify-kept: one-time, read-only (F160): for each kept BSE-only company, three paced calls a company through the ported BSE adapter
#   (stock-page header: status; trading panel: market cap; announcements filtered by the scrip, last 90 days); a refusal stops the run and
#   its body head goes in the file; JSON and CSV up as the artifact `bse-verify-kept`. Its group is the BSE one.
# - label-memory: reads every stored memory (and the cards' XBRL tables; no NSE, no writes) and counts what the one-off
#   labelling would give each item (file / ai / calc / unknown) per section; the JSON goes up as the artifact `label-memory`.
#   label-memory-apply: the same, then writes each changed memory back through the safe three-way merge, resuming after the
#   last company done (a second run only finishes what is left; exit 124 = run it again). No card changes (F150).
# - audit-precision: read-only on/off audit of the candidate number-matching rule (match at the precision the filing prints;
#   pipeline/scripts/audit_precision.py, docs/audit/precision-2026-10-26.md) over every stored card and its text in R2;
#   summary.json, lines.json and the blind-sample markdown go up as the artifact `audit-precision`. No writes.
# - release-check: read-only on/off comparison of the nine card switches that are built but off (CARD_EBITDA_PROFIT_V2,
#   CARD_SAME_DEFINITION, CARD_CONSOLIDATED_ONLY, CARD_TWO_PARTS, QUOTE_EXACT_NUMBERS, CARD_GROUNDED_FIGURES,
#   CARD_GUIDANCE_DATED, CARD_ONE_BASIS, MEMORY_YEAR_CHECK; the parts that cannot be replayed offline are listed, not faked; pipeline/scripts/release_check.py,
#   F170) over every stored card, its text in R2 and its company's memory, no AI. Per switch: what changed (cards, lines
#   added, removed, changed), a plain-text summary and a seeded blind sample of up to 20 changed cards with its key, all up
#   as the artifact `release-check`. No writes.
#   `ids` (check names, comma separated, e.g. `text_support`) runs only those checks (`--only`); empty runs every check. The
#   `text_support` check (CARD_TEXT_SUPPORT, TODO 142) lists every item the switch would drop from the stored cards outside the
#   34 in-sample ones, with a seeded blind sample of up to 60 of them.
# - screener-fill: the one-time fill of the quarters memory lacks from screener.in (owner permission 26 Oct 2026; F161). A
#   dry run: one page per company with a gap (the page on memory's basis), at least 3 s between requests per runner, two
#   runners (job `screener`), a plain browser User-Agent, no login; nothing is written. The counts, the reasons skipped and
#   a CSV of every proposed fill with its overlap evidence go up as the artifacts `screener-fill-0` and `screener-fill-1`.
#   screener-fill-apply: the same, then writes the figures as by="screener" (dossier section screener_fill; no card reads
#   them unless MEMORY_SCREENER=1). A company already tried is not asked again; a run that ends on its time budget (exit
#   124) is started again by hand and resumes; `restart` tries them all again. screener.in refusing (exit 75) fails the shard.
# - screener-download: the one-time download of every company's two screener.in pages (owner permission 26 Oct 2026; F163,
#   TODO 50), raw and gzipped into R2 at raw/screener/<date>/<SYMBOL>_<c|s>.html.gz. Two runners (job `screener`), one request
#   per 3.2 s each, about 3,800 requests, about 1.7 hours on 2 shards; a page already stored for the date is not fetched
#   again; a run that ends on its time budget (exit 124) is started again and resumes; `restart` ignores the finished list;
#   screener.in refusing (403, 429, 503: exit 75) fails the shard. Its own concurrency group `screener`, so it runs beside the
#   NSE memory jobs: it touches no NSE call and no memory. Summary: artifacts `screener-download-0` and `screener-download-1`.
# - The three BSE downloads (text-backfill-bse, bse-annual-xbrl, bse-results-xbrl) each have their own group (owner, 29 Oct
#   2026: "asking for 3 runners so all BSE jobs start running individually"): up to three runners on BSE at once, each at the
#   adapter's own pace and each stopping on a refusal; the other BSE commands stay in maint-bse.
# - bse-results-xbrl (owner, 29 Oct 2026): the results XBRL BSE holds for the quarters NSE does not (companies listed on NSE
#   late), through the fill's ported BSE client; every file kept in the XBRL store, its facts as the results doc unless one is
#   stored, a company with every quarter of the last 13 stored never asked. Group maint-bse; `file_cap` caps a test.
# - bse-annual-xbrl (owner, 29 Oct 2026: "go for 100 but ensure to save them"): the annual-report XBRL BSE lists for the years
#   NSE does not (before NSE/CML/2026/08 of 20 Apr 2026 a company could file it with BSE alone; FY23 too), through the ported
#   adapter; each file kept raw at raw/bse-annual-xbrl/<scrip>/<file>.gz and its facts as the annual document unless NSE's is
#   stored, a stored year never asked again. Group maint-bse; `file_cap` caps a test, `limit` takes the N largest companies.
# - screener-schedules (owner, 29 Oct 2026: "Feel free to even get everything"): the sub-rows behind each "+" head of the stored
#   screener pages (screener_schedules.py): one request a head to /api/company/<id>/schedules/ (robots.txt allows it), 2.5 s
#   apart a runner (owner: 2-3 s), the same stop rule, the largest companies first, twelve runners (job `schedules`); every
#   expandable sub-row is asked too, and both pages of a company go in one file, raw/screener-schedules/<day>/<SYMBOL>.json.gz;
#   a stored company is not asked again; `file_cap` = at most that many requests a runner; exit 124 resumes. Artifacts
#   `screener-schedules-<shard>`.
# - tijori-download: the download of every company's financials page from Tijori Finance (owner request 26 Oct 2026; F189, TODO 92),
#   gzipped JSON tables into R2 at raw/tijori/<date>/<SYMBOL>.json.gz. One runner (job `tijori`) for the whole universe: 8 threads
#   behind one shared limiter at TIJORI_RATE requests a second (default 6; about 1,900 pages, 5 to 6 minutes). The first refusal
#   (403, 429, 503, a challenge page) drops it to one request every 3 s and is recorded in the summary; a second one (exit 75)
#   fails the job. `limit` (input) = a trial on the first N companies; a page stored for the date is not fetched again; exit 124
#   leaves a marker and the command is started again. Its own concurrency group `maint-tijori`. No AI, no NSE, no memory
