# Prices, 1W/1M/1Y returns, market cap, size bucket, price charts and technicals for every company with cards, then
# the price post-mortem (Loop 1). Runs the morning after each session (schedule below).
name: Market data

on:
  workflow_dispatch:
  schedule:
    # 00:35 UTC = 06:05 IST, Tuesday to Saturday: the previous session's close is on Yahoo overnight, not at 16:15 IST
    # (owner, 2026-10-20); after D1's daily allowance resets and before the market opens
    - cron: "35 0 * * 2-6"

permissions:
  contents: read

concurrency:
  group: bse-market-data
  cancel-in-progress: false

# The card and memory switches come from pipeline/config/switches.toml, the same in every job; a repository variable of
# the same name wins over it (settings._switch). REPO_VARS carries them all, so none has to be listed here.
env:
  REPO_VARS: ${{ toJSON(vars) }}

jobs:
  refresh:
    # off with the schedule switch, as the pipeline and the nightly are (a dispatch, the watchdog's included, still runs)
    if: github.event_name != 'schedule' || vars.PIPELINE_SCHEDULE == 'on'
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners get Python from setup-python; a self-hosted runner (a laptop or a
      # Raspberry Pi on an Indian network) uses its own python3, which setup-python may not support.
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[market]"
      - run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel market-data'
      - name: Price post-mortem (Loop 1)
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel post-mortem'
      # NSE's large-deals snapshot holds the last session only: read each trading morning (and again by the nightly)
      - name: Bulk and block deals into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel deals-sync'
