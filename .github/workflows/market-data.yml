# Post-close financial footer refresh: prices, 1W/1M/1Y returns, market cap
# and size bucket for every company with cards. 10:45 UTC = 16:15 IST.
name: Market data

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: bse-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners get Python from setup-python; a self-hosted runner (a laptop or a
      # Raspberry Pi on an Indian network) uses its own python3, which setup-python may not support.
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[market]"
      - run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel market-data'
      - name: Price post-mortem (Loop 1)
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel post-mortem'
