# Started by hand: named models tried on stored filings before they go on a route (owner, 24 Oct 2026: Gemma 4 on
# OpenRouter). Nothing is published: the analysis runs with the local sink, and ONLY_MODEL sends every route that has
# one of the named models to it alone. The OpenRouter key's own status (usage, limit, free tier) is printed first,
# without the key or its label. The cards go to an artifact for review.
name: Model trial

on:
  workflow_dispatch:
    inputs:
      models:
        description: ONLY_MODEL - provider:model, comma separated (level 1 and card writing can be tried together)
        type: string
        default: 'openrouter:google/gemma-4-26b-a4b-it:free,openrouter:google/gemma-4-31b-it:free'
      filings:
        description: the filings to try (a JSON list in the repository)
        type: string
        default: scripts/model_trial_filings.json

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BSE_INTEL_SINK: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[ocr]"
      - name: OpenRouter key status (usage and limits only)
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import json, os, urllib.request
          req = urllib.request.Request("https://openrouter.ai/api/v1/key",
                                       headers={"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"].strip()})
          data = json.load(urllib.request.urlopen(req, timeout=30)).get("data", {})
          print(json.dumps({k: data.get(k) for k in ("usage", "usage_daily", "limit", "limit_remaining", "is_free_tier",
                                                     "rate_limit", "is_provisioning_key")}, indent=2))
          EOF
      - name: Try the models
        env:
          ONLY_MODEL: ${{ inputs.models }}
          FILINGS: ${{ inputs.filings }}
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/model_trial.py "$FILINGS" trial.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-trial
          path: pipeline/trial.json
