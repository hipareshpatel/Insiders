# The daily no-AI jobs that keep memory and the site's summaries current, on a fixed slot (owner, 2026-10-20: jobs that
# only ran when a pipeline run had time left, or never, need a proper schedule). Each also runs inside `run` when a
# live run has time; here they run every day whatever the queue.
# 00:40 UTC = 06:10 IST: after NSE's and Yahoo's overnight updates, after D1's daily write allowance resets (05:30 IST),
# before the market opens. Each command records its last run (kv job:<command>), shown on the System page.
# The AI pipeline pauses while the memory jobs write (owner, 2026-10-21; pause.py): a live run holds a company's memory
# for minutes and writes it back whole, so a job's write in between would be lost. The pause ends by itself.
name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * *"

permissions:
  contents: read
  actions: read   # sees whether a pipeline run is still going before the memory jobs start

concurrency:
  group: bse-nightly
  cancel-in-progress: false

# The card and memory switches come from pipeline/config/switches.toml, the same in every job; a repository variable of
# the same name wins over it (settings._switch). REPO_VARS carries them all, so none has to be listed here.
env:
  REPO_VARS: ${{ toJSON(vars) }}

jobs:
  nightly:
    if: github.event_name != 'schedule' || vars.PIPELINE_SCHEDULE == 'on'
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # the steps' own budgets add to ~60 min after a wait of up to 15 for a running pipeline, then the annual catch-up
    # (12) and the summaries: at 55 the last step, whose job record the watchdog reads, could be cut off (survey, 24 Oct
    # 2026). watchdog.py's grace for this job is longer than this.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      DISCOVERY_SOURCE: nse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "."
      # so the pipeline's watchdog does not start a second nightly while this one (perhaps started late) still runs
      - name: Record the start
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel missed-jobs --running nightly.yml || true'
      - name: Pause the AI pipeline
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel pause-ai --minutes 90'
      # a running pipeline looks for the pause once a minute and stops after the filing it is on
      - name: Wait for a running pipeline to stop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pipeline.yml --status in_progress --json databaseId -q length)
            [ "$n" = "0" ] && exit 0
            sleep 30
          done
          echo "a pipeline run is still going after 15 min; the memory jobs start anyway"
      # one job's failure never stops the next (each step runs whatever came before)
      - name: Quarterly governance reports into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel governance-sync --time-budget 600'
      - name: Shareholding patterns into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel shareholding-sync --days 25 --time-budget 900'   # 25 days: a quarter's patterns come over three weeks; ones read before 21 Oct are read again once for their institutional detail
      - name: Promoter pledge events into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel pledge-sync --time-budget 300'
      - name: Bulk and block deals into memory (a second read; each deal is filed once)
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel deals-sync'
      - name: Insider trades (SEBI PIT Reg 7) into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel insider-sync --days 3 --time-budget 600'
      - name: Corporate actions (splits, bonuses, dividends) into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel corporate-actions-sync --days 30 --time-budget 300'
      - name: DGTR trade-remedy cases into memory
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel dgtr-sync --time-budget 600'
      # before the annual-report re-runs, which are AI work themselves
      - name: Resume the AI pipeline
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel resume-ai'
      - name: Annual reports re-read once their XBRL is listed
        if: always()
        run: timeout 12m bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel annual-xbrl-catchup --max-companies 150 || [ $? -eq 124 ]
      # every fact of the results files the live path kept in R2 since the last run (raw/xbrl-facts/), so the screener-row
      # rules (screener_view) have each new filing's full statements; stored files only, no NSE request, no memory write;
      # a company whose facts are stored is skipped, so a run cut by its budget resumes the next night
      - name: Facts of the stored results files (stored files only, no NSE)
        if: always()
        run: timeout 20m "$RUNNER_TEMP/venv/bin/python" -m bse_intel xbrl-facts --time-budget 1080 || [ $? -eq 124 ]
      - name: Held cards published without their unquoted points (prune.py)
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel release-pruned'
      # last: summaries read the memory the steps above wrote (overdue promises move with the date, not only with filings)
      - name: Company summaries (overdue promises, radar, credibility)
        if: always()
        run: 'bash scripts/retry.sh "$RUNNER_TEMP/venv/bin/python" -m bse_intel refresh-summaries'
