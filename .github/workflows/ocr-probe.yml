name: OCR probe

# Read-only check that RapidOCR runs on a GitHub-hosted runner: NSE's announcement list, a handful of
# its PDFs, a few pages of each OCR'd, with seconds a page and the share of each page's text-layer
# figures OCR also reads. No secrets, no writes, no AI calls. The job summary is the result.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ocr-probe.yml
      - pipeline/scripts/ocr_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install the pipeline and RapidOCR
        run: pip install -e . rapidocr_onnxruntime
      - run: nproc && free -h
      - run: python scripts/ocr_probe.py --files 8 --pages 3 --report "$GITHUB_STEP_SUMMARY"
