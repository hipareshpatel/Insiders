name: Online-only probe

# Read-only check that an NSE-first, online-only pipeline gets what it needs on a GitHub-hosted runner:
# announcements, event XBRL (orders, director changes, actions), results and annual-report XBRL timing, a PDF read
# by the pipeline. No secrets, no writes, no AI calls. The job summary is the result.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/online-probe.yml
      - pipeline/scripts/online_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[market]"
      - name: Where the runner is
        run: curl -s --max-time 10 https://ipinfo.io/json | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('ip'), d.get('city'), d.get('country'), d.get('org'))" || true
      - run: python scripts/online_probe.py --report "$GITHUB_STEP_SUMMARY"
