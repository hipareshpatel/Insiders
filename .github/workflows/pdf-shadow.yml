# The shadow check of live results cards with the numbers-first PDF reader (TODO 121, owner 29 Oct 2026). Read only: for each
# results card filed in the last hours it reads the filing's PDF and logs, per headline figure (revenue or total income, PBT,
# profit), agrees / disagrees / unknown against the card, with the reason and the seconds spent on the PDF. Nothing on the site,
# in memory or in a card changes; no AI. Rows go to R2 (meta/pdf-shadow/<day>.csv) every 3 cards, so a stopped run keeps them and
# the next run skips the cards already logged. It runs beside the 15-minute pipeline, never inside it.
#
# Switch: the schedule runs only when the repository variable PDF_SHADOW is "on" (the owner sets it). A manual dispatch always runs.
name: PDF shadow

on:
  workflow_dispatch:
    inputs:
      limit:
        description: read at most this many cards' PDFs (empty = every card of the window)
        default: ""
      since_hours:
        description: results cards filed in the last N hours
        default: "3"
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: pdf-shadow
  cancel-in-progress: false

env:
  REPO_VARS: ${{ toJSON(vars) }}

jobs:
  shadow:
    if: github.event_name != 'schedule' || vars.PDF_SHADOW == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      # its own token (TODO 123 (10)): the Worker lets it run the read queries and read and write meta/pdf-shadow/ only, never a
      # write statement, so this job cannot change a card. The same value is the Worker secret SHADOW_TOKEN.
      INGEST_TOKEN: ${{ secrets.SHADOW_TOKEN }}
      PLATFORM_TIMEOUT_S: "30"
      PLATFORM_ATTEMPTS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Token check
        run: test -n "$INGEST_TOKEN" || { echo "::error::the repository secret SHADOW_TOKEN is not set (the shadow job never uses INGEST_TOKEN)"; exit 1; }
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[ocr]"
      - name: Shadow check (reads only)
        timeout-minutes: 50   # a step that overruns ends here, so the upload step below still runs
        env:
          LIMIT: ${{ inputs.limit }}
          SINCE_HOURS: ${{ inputs.since_hours || '3' }}
        run: |
          mkdir -p "$RUNNER_TEMP/pdfshadow"
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel pdf-shadow --since-hours "$SINCE_HOURS" ${LIMIT:+--limit "$LIMIT"} --time-budget 2400 --out-csv "$RUNNER_TEMP/pdfshadow/pdf-shadow.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-shadow
          path: ${{ runner.temp }}/pdfshadow/
          if-no-files-found: ignore
