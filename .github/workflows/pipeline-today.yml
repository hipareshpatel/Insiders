# The quick run (owner, 25 Oct 2026): today's new filings only, every 15 minutes, in about 10 minutes, so a filing no
# longer waits for the full run (pipeline.yml, ~41 minutes, which now leaves today to this one). Same keys, same AI
# routes; no window, no catch-ups, no backfill. Setting the repository variable PIPELINE_TODAY_SPLIT to "off" stops it
# and gives today back to the full run.
#
# Source: NSE (owner, 2026-10-18: online-only, NSE only). NSE answers every call the pipeline makes from a
# GitHub-hosted runner (measured 2026-10-18 with online-probe.yml), so ubuntu-latest is the runner; the
# repository variable PIPELINE_RUNNER_LABELS can still point it elsewhere. BSE's API refuses GitHub's
# addresses and is off this path (DISCOVERY_SOURCE=bse is kept only as a backup).
#
# Triggers: GitHub's schedule (every 15 minutes, when the repository variable PIPELINE_SCHEDULE is "on") and by hand.
# GitHub drops scheduled runs when busy; the full run reads today last as a safety net.
#
# An NSE refusal (401/403/429) or five attachment downloads failing on the network in a row stop the run
# with the work still queued; no filing's attempts are spent on either.
name: Pipeline (today)

on:
  workflow_dispatch:
    inputs:
      time_budget:
        description: seconds of work before the run stops picking up filings
        default: "600"
  schedule:
    # every 15 minutes (owner, 2026-10-20); the concurrency group below queues a run while one is going, never two at once
    - cron: "9,24,39,54 * * * *"

permissions:
  contents: read
  actions: write   # starts a daily job GitHub did not start (watchdog.py)

concurrency:
  group: bse-pipeline-today
  cancel-in-progress: false

# The card and memory switches come from pipeline/config/switches.toml, the same in every job; a repository variable of
# the same name wins over it (settings._switch). REPO_VARS carries them all, so none has to be listed here.
env:
  REPO_VARS: ${{ toJSON(vars) }}

jobs:
  run:
    if: (github.event_name != 'schedule' || vars.PIPELINE_SCHEDULE == 'on') && vars.PIPELINE_TODAY_SPLIT != 'off'
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      BACKFILL_CARDS_FROM: ${{ vars.BACKFILL_CARDS_FROM }}   # a date: backfill before it goes into memory only (F117); unset = off, cards as before
      RESULTS_FACTS: ${{ vars.RESULTS_FACTS || '1' }}   # 0: results cards without the figures computed in code (facts.py)
      RESULTS_RICH: ${{ vars.RESULTS_RICH || '1' }}     # 0: results cards without the model's quoted facts and memory points
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
      NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
      ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DISCOVERY_SOURCE: nse
      UNIVERSE_MIN_MCAP_CR: ${{ vars.UNIVERSE_MIN_MCAP_CR || '500' }}
      BACKFILL_START: ${{ vars.BACKFILL_START || '2026-04-19' }}  # 6 months back (owner, 2026-10-18)
      # Packed Gemini: up to 6 filings' cards in one request (ai/packer.py; rounds 5B and 6: Gemini 3 of 55 WRONG).
      # A filing waits at most PASS2_PACK_WAIT seconds for others, and never past the run's deadline.
      PASS2_PACK: ${{ vars.PASS2_PACK || '6' }}
      PASS2_PACK_WAIT: ${{ vars.PASS2_PACK_WAIT || '60' }}
      # Backfill filings wait longer: no reader waits for them, and Gemini's free tier counts requests, not filings.
      PASS2_PACK_WAIT_BULK: ${{ vars.PASS2_PACK_WAIT_BULK || '180' }}
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners get Python from setup-python; a self-hosted runner (a laptop or a
      # Raspberry Pi on an Indian network) uses its own python3, which setup-python may not support.
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[ocr]"
      # The extracted text of each filing, kept from run to run: the repeat check (duplicates.py) compares a filing with
      # the same company's earlier ones by this text, and a fresh runner has none (20 Oct 2026: Kapston's results
      # outcome filed twice four minutes apart, the same PDF, two cards). A retry also skips the download and OCR.
      - uses: actions/cache/restore@v4
        with:
          path: data/text_cache
          key: text-cache-${{ github.run_id }}
          restore-keys: text-cache-
      # today's texts, read by the quick run (pipeline-today.yml), are added in, so this run's own saved cache holds them
      - uses: actions/cache/restore@v4
        with:
          path: data/text_today
          key: text-today-${{ github.run_id }}
          restore-keys: text-today-
      - name: Add today's texts
        working-directory: .
        run: mkdir -p data/text_cache && cp -rn data/text_today/. data/text_cache/ 2>/dev/null || true
      # The DeepSeek drain (owner, 21 Oct 2026: "use deepseek for pending and let's clear them"): while
      # pipeline/config/drain_until holds a UTC time still ahead, the prepaid DeepSeek key (D24) is passed, preferred on
      # every route that has it and the run uses 8 workers. Past that time, or with the file gone, runs are free-tier only
      # again (the $0 steady state). The balance is prepaid with no card on file, so spending stops when it runs out.
      - name: Run pipeline
        env:
          # F169, owner 26 Oct 2026 (TODO 97 "yes to parallel downloads"): files and attachments on nsearchives at its own
          # pace, so the run's workers download them side by side; the API keeps 3-5 s; a 403/429/503 slows it back
          NSE_ARCHIVE_PAUSE_SECONDS: "0,0"
          DEEPSEEK_SECRET: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          until=$(cat config/drain_until 2>/dev/null | tr -d '[:space:]')
          if [ -n "$until" ] && [ "$(date -u +%Y-%m-%dT%H:%M)" \< "$until" ]; then
            export DEEPSEEK_API_KEY="$DEEPSEEK_SECRET" PREFER_MODEL=deepseek:deepseek-flash PIPELINE_WORKERS=8
            echo "DeepSeek drain on until $until UTC"
          fi
          export PIPELINE_TODAY=only
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel run --mode live --time-budget "${{ inputs.time_budget || '600' }}"
      - name: Keep the last 2 days of text
        if: always()
        working-directory: .
        run: find data/text_cache -type f -mtime +2 -delete 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/text_cache
          key: text-today-${{ github.run_id }}
