# Runs the filings pipeline: live filings first, then historical backfill,
# within a time budget. State lives in D1, so every run resumes where the
# last one stopped.
#
# Triggers: cron-job.org (every 15-30 min) calls the workflow_dispatch API;
# the schedule below is only a fallback, since GitHub runs scheduled
# workflows on a best-effort basis.
#
# Runner: set the repository variable PIPELINE_RUNNER_LABELS, e.g.
# ["self-hosted","linux"], to use a self-hosted runner on an Indian network.
# BSE's API refuses some non-Indian datacenter IPs, which GitHub-hosted
# runners use. See docs/SPEC.md, "Where the pipeline runs".
name: Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: live, backfill or all
        default: all
        type: choice
        options: [all, live, backfill]
      time_budget:
        description: seconds of work before the run stops picking up filings
        default: "2700"
  repository_dispatch:
    types: [run-pipeline]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: bse-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 55
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      BACKFILL_START: ${{ vars.BACKFILL_START || '2026-01-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - name: Run pipeline
        run: python -m bse_intel run --mode "${{ inputs.mode || 'all' }}" --time-budget "${{ inputs.time_budget || '2700' }}"
