# Started by hand: which models each AI provider serves (no AI request) and, for providers already on a route, one tiny
# request per configured model (`ai-check`: a few tokens each). Used before a provider gets a route (owner added the
# SambaNova and SiliconFlow keys on 2026-10-20) and when a model is retired. Keys come from the repository's secrets;
# no key or answer body is printed, only model IDs and each check's result.
name: Providers check

on:
  workflow_dispatch:
    inputs:
      ai_check:
        description: also send one tiny request to each model of the route below (a few tokens each)
        type: boolean
        default: false
      route:
        description: the route whose models ai-check tries (trial_new = the new candidates only; all = every route)
        type: string
        default: trial_new
      provider:
        description: ai-check only this provider's configured models (e.g. openrouter); empty = every provider of the route
        type: string
        default: ''
      trial_models:
        description: model trial on stored filings (scripts/model_trial.py, nothing published) - ONLY_MODEL, comma separated; empty = no trial
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}   # call memory only (providers.gemini_3, only_routes)
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
      NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
      ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      BSE_INTEL_SINK: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[ocr]"
      - name: SambaNova models
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel models --provider sambanova'
      - name: SiliconFlow models
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel models --provider siliconflow'
      - name: DeepSeek models
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel models --provider deepseek'
      # the keyed providers with no writer on the card routes yet (owner, 2026-10-22: add one or two backup writers)
      - name: NVIDIA, Groq and Mistral models
        if: always()
        run: |
          for p in nvidia groq mistral; do "$RUNNER_TEMP/venv/bin/python" -m bse_intel models --provider "$p" || true; done
      # OpenRouter's free models (":free"), to choose a fixed named one from (owner, 24 Oct 2026)
      - name: OpenRouter free models
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel models --provider openrouter --filter ":free"'
      - name: Configured models still served
        if: always()
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel models'
      - name: One tiny request per configured model
        if: always() && inputs.ai_check
        env:
          ROUTE: ${{ inputs.route }}
          PROVIDER: ${{ inputs.provider }}
        # "all": every route (an empty input fell back to the default, trial_new, on 22 Oct)
        run: '[ "$ROUTE" = all ] && ROUTE=; "$RUNNER_TEMP/venv/bin/python" -m bse_intel ai-check ${ROUTE:+--route "$ROUTE"} ${PROVIDER:+--provider "$PROVIDER"}'
      # The OpenRouter key's own status, without the key or its label (owner, 24 Oct 2026)
      - name: OpenRouter key status (usage and limits only)
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import json, os, urllib.request
          req = urllib.request.Request("https://openrouter.ai/api/v1/key",
                                       headers={"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"].strip()})
          data = json.load(urllib.request.urlopen(req, timeout=30)).get("data", {})
          print(json.dumps({k: data.get(k) for k in ("usage", "usage_daily", "limit", "limit_remaining", "is_free_tier",
                                                     "rate_limit", "is_provisioning_key")}, indent=2))
          EOF
      - name: DeepSeek balance (prepaid amount only)
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.deepseek.com/user/balance",
                                       headers={"Authorization": "Bearer " + os.environ["DEEPSEEK_API_KEY"].strip()})
          print(json.dumps(json.load(urllib.request.urlopen(req, timeout=30)), indent=2))
          EOF
      # Named models on stored filings before they go on a route (owner, 24 Oct 2026: Gemma 4): the local sink, so
      # nothing is published; ONLY_MODEL sends every route that has one of them to it alone
      - name: Model trial on stored filings
        if: always() && inputs.trial_models != ''
        env:
          ONLY_MODEL: ${{ inputs.trial_models }}
          DEEPSEEK_API_KEY: ''
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/model_trial.py scripts/model_trial_filings.json trial.json'
      - uses: actions/upload-artifact@v4
        if: always() && inputs.trial_models != ''
        with:
          name: model-trial
          path: pipeline/trial.json
