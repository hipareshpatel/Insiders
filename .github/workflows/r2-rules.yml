# Read-only: lists the R2 bucket's lifecycle (auto-delete) rules, to check which folders they cover (owner, 25 Oct
# 2026). Changes nothing. Run by hand: Actions > R2 rules > Run workflow.
name: R2 rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lifecycle rules of bucket bse-intelligence
        run: npx wrangler r2 bucket lifecycle list bse-intelligence
