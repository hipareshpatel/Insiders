# Held cards whose only faults were points their quote did not carry, published without those points (release-pruned,
# pipeline/src/bse_intel/prune.py; owner, 2026-10-21: "Needs review · 475"). No AI, no memory write: only card rows,
# so it runs beside maintenance (its own concurrency group: maintenance keeps one pending run and the seed's
# self-dispatch would cancel a release queued behind it). The nightly run repeats it for stragglers.
name: Release held cards

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: count what would be released, write nothing
        type: boolean
        default: true
      plan:
        description: a reviewed release plan in docs/audit/live (empty = the quote-only prune)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bse-release-held
  cancel-in-progress: false

# The card and memory switches come from pipeline/config/switches.toml, the same in every job; a repository variable of
# the same name wins over it (settings._switch). REPO_VARS carries them all, so none has to be listed here.
env:
  REPO_VARS: ${{ toJSON(vars) }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "."
      - name: Publish held cards without their unquoted points
        if: inputs.plan == ''
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel release-pruned ${{ inputs.dry_run && ''--dry-run'' || '''' }}'
      - name: Publish held cards a blind review cleared, without the points it named
        if: inputs.plan != ''
        env:
          PLAN: ${{ inputs.plan }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: '"$RUNNER_TEMP/venv/bin/python" -m bse_intel release-reviewed --plan "../$PLAN" $DRY'
