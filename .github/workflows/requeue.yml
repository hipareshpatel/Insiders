# Re-run filings beside Maintenance: the named ones (ids) and, with needs_review, every card the review queue holds for
# a fault of its own (owner, 2026-10-22: "re run if needed, we have deepseek also now"). Its own concurrency group:
# Maintenance keeps one pending run and a seed pass's self-dispatch would cancel a requeue queued behind it. Writes only
# the filings' status; the live runs re-read them with today's prompt and checks.
name: Requeue

on:
  workflow_dispatch:
    inputs:
      needs_review:
        description: every held or flagged card the review queue holds for a fault of its own
        type: boolean
        default: false
      ids:
        description: news ids to re-run as well (comma separated)
        type: string
        default: ''
      dry_run:
        description: list what would be re-run, write nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: requeue
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e "."
      - name: Requeue
        run: |
          args=()
          ${{ inputs.needs_review && 'args+=(--needs-review)' || 'true' }}
          [ -n "$IDS" ] && args+=(--ids "$IDS")
          ${{ inputs.dry_run && 'args+=(--dry-run)' || 'true' }}
          [ ${#args[@]} -eq 0 ] && { echo "nothing asked"; exit 1; }
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel requeue-failed "${args[@]}"
