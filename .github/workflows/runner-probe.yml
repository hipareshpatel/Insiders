name: Runner probe

# Read-only check that BSE, NSE and Yahoo answer a GitHub-hosted runner, through the pipeline's own
# clients: announcements, attachment PDFs, BSE's results archive, NSE's Integrated Filing XBRL,
# shareholding and prices. No secrets, no writes, no AI calls. The job summary is the result.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/runner-probe.yml
      - pipeline/scripts/runner_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[market]"
      - name: Where the runner is
        run: curl -s --max-time 10 https://ipinfo.io/json | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('ip'), d.get('city'), d.get('country'), d.get('org'))" || true
      - run: python scripts/runner_probe.py --report "$GITHUB_STEP_SUMMARY"
