# Each universe company's last two quarters of earnings-call transcripts or investor presentations into memory
# (call_seed.py; owner, 2026-10-20: the dossiers were too shallow; no Gemini). No card, no ledger row. The memory_seed
# route: the prepaid DeepSeek first while its secret is set (D24, the owner's approved seed with its cap), else the
# free Z.AI / OpenRouter models. Resumable: it stops after 40 minutes and the next run goes on
# from the next company; once every company is done each run returns at once.
# At night, 16:15-23:45 UTC = 21:45-05:15 IST: Z.AI's free model takes one request at a time per key, which the live runs
# share, so the seed runs when few filings arrive. A run that stops at its budget with companies left starts the next
# one itself (call_seed.next_run; GitHub dropped two of the first four scheduled runs, 20 Oct 2026). The schedule, twice
# an hour, is the backstop: a run it starts while one is going waits in the concurrency group.
name: Seed calls

on:
  workflow_dispatch:
    inputs:
      restart:
        description: start again from the largest company
        type: boolean
        default: false
      scrips:
        description: only these companies (comma separated), for a trial
        type: string
        default: ''
  schedule:
    - cron: "15,45 16-23 * * *"

permissions:
  contents: read
  actions: write   # a run starts the next one (workflow_dispatch) while companies are left

concurrency:
  group: bse-seed-calls
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name != 'schedule' || vars.PIPELINE_SCHEDULE == 'on'
    runs-on: ${{ fromJSON(vars.PIPELINE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: pipeline
    env:
      BSE_INTEL_SINK: platform
      D1_PLAN: ${{ vars.D1_PLAN }}   # paid (Workers Paid, the default) or free: settings.d1_plan
      BACKFILL_CARDS_FROM: ${{ vars.BACKFILL_CARDS_FROM }}   # backfill before it: memory only (default 2026-08-01; off = cards)
      PLATFORM_API_URL: ${{ secrets.PLATFORM_API_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      DISCOVERY_SOURCE: nse
      # the prepaid DeepSeek (D24) only here, never in pipeline.yml; without the secret the seed stays on the free models
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
      ZAI_API_KEY_2: ${{ secrets.ZAI_API_KEY_2 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PASS2_PACK: "0"
      # 6 companies at a time (the default is 3): DeepSeek sets no concurrency cap and its prompt cache is per account and
      # by content, so parallel requests keep their cache hits; NSE (lists and PDFs, limited by IP) and Z.AI's one slot
      # are what bound it, and the gateway still paces each model. 20 Oct 2026 at 3: ~50-64 companies a 40-min run.
      PIPELINE_WORKERS: "6"
      SCRIPS: ${{ inputs.scrips }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !contains(vars.PIPELINE_RUNNER_LABELS || '', 'self-hosted') }}
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[ocr]"
      - name: Seed memory from calls and presentations
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m bse_intel seed-calls --time-budget 2400 ${SCRIPS:+--scrips "$SCRIPS"} ${{ inputs.restart && '--restart' || '' }} | tee "$RUNNER_TEMP/seed-report.txt"
      # a trial with --scrips never hands on; a failed run neither (the schedule picks up after it)
      - name: Start the next run
        if: success() && env.SCRIPS == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if "$RUNNER_TEMP/venv/bin/python" -c "import sys, datetime; from bse_intel.call_seed import next_run_from_output as n; sys.exit(0 if n(sys.argv[1], datetime.datetime.now(datetime.timezone.utc).hour) else 1)" "$RUNNER_TEMP/seed-report.txt"; then
            gh workflow run seed-calls.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f restart=false
            echo "next run started"
          else
            echo "no next run: done, nothing read, or the night is over"
          fi
