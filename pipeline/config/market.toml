# Market-data enrichment (post-close job).
#
# Size tiers by market cap in ₹ crore (blueprint §8: Microcap < ₹500 Cr, Smallcap ₹500-5,000 Cr,
# Midcap ₹5,000-20,000 Cr, Largecap > ₹20,000 Cr).
[size_buckets]
LARGE = 20000
MID = 5000
SMALL = 500
# anything below SMALL is MICRO

[yfinance]
batch = 100              # tickers per bulk price download
max_companies = 3000     # companies enriched per run (those with cards, most recent first)
shares_refresh_days = 7  # refresh shares outstanding weekly
max_share_lookups = 150  # per-ticker share-count lookups per run (no cap with --all)
turnover_days = 30       # median daily traded value over this many sessions (liquidity floor)
