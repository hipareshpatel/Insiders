# Pass 2 packed (PASS2_PACK=N, ai/packer.py): N filings in one request, so a free model with few requests a day can
# write a regular share of cards. Gemini 3.6 Flash wrote the best free cards in round 4 (11% WRONG on 9) but allows 20
# requests a day, each Gemini model counted apart (measured 2026-10-19): three models packed 6 to a request is ~360
# cards a day. In order; a model out of its day's quota hands the pack to the next.
# Since 2026-10-21 (ai-quality plan item 1) live and backfill filings are packed apart, and long filings (pass2_long)
# are packed too, with other long ones only, PASS2_PACK_LONG (3) to a request; they fall back to pass2_long as before.

