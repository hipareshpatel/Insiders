# ------------------------------------------------------------------ Pass 2: deep analyst
# Weighted rotation. Nemotron 3 Super (a reasoning model) is the primary
# analyst; any <think> block is stripped before validating. NVIDIA retired
# DeepSeek-R1 and Llama 3.3 70B, and deepseek-v4.1-flash took >200 s per reply.
# Prompts larger than a model's context_tokens skip that model, so very long
# presentations and annual reports flow to GLM's 200K window.

[[routes.pass2]]
provider = "nvidia"
model = "nvidia/nemotron-3-super-120b-a12b"
weight = 3
json_mode = true
strip_reasoning = true
max_tokens = 8000
context_tokens = 120000
limits = { rpm = 40 }

[[routes.pass2]]
provider = "zai"
model = "glm-4.7-flash"
weight = 2
json_mode = true
max_tokens = 3000
context_tokens = 190000
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60, concurrency = 1 }  # free GLM: one request at a time

[[routes.pass2]]
provider = "mistral"
model = "ministral-14b-2512"  # the free tier blocks mistral-large; 937k tokens/min, 0.5 requests/s
weight = 1
json_mode = true
max_tokens = 3000
context_tokens = 120000
limits = { rpm = 25, tpm = 937_500 }

[[routes.pass2]]
provider = "gemini"
model = "gemini-3.6-flash"  # an established model, not the newest (3.8 is often overloaded); 5 requests/min measured, ~20/day unconfirmed, so a spare
