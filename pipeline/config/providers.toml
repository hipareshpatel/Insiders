# AI providers and routes for the centralized gateway.
#
# Every provider speaks the OpenAI chat-completions protocol. Model IDs and
# free-tier limits change often: check each console and edit this file; no
# code change is needed. A provider whose key (or base-URL variable) is unset
# is skipped, so the pipeline runs with any subset of providers.
#
# Operational rules (see bse_intel/ai/gateway.py):
# * 95% safety ceiling: every limit below is scaled by `safety_ceiling`. A
#   model leaves the active pool at 95% of its daily/monthly quota, and
#   per-minute pacing keeps it under 95% of rpm/tpm. A 429 puts the model in
#   cooldown (Retry-After), and a 429 that mentions a daily quota retires it
#   for the day.
# * Never hammer one provider: routes listed under [gateway.strategies] as
#   "weighted" rotate across their pool by `weight` (smooth round-robin);
#   other routes are priority order.
# * `spare = true` targets are used only after every other target failed or
#   hit its ceiling.
# * Graceful degradation: when nothing can serve a request, the pipeline
#   waits 60 s and retries if the blockers are per-minute limits/cooldowns,
#   or leaves the filing PENDING in the D1 queue if they are daily/monthly
#   ceilings. Nothing is dropped.
#
# Limits are per model unless set on the provider (shared allowances such as
# a monthly token budget across all of a provider's models).

[gateway]
safety_ceiling = 0.95

[gateway.strategies]
pass2 = "weighted"
pass2_bulk = "weighted"
pass2_long = "weighted"

# ------------------------------------------------------------------ providers

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
timeout_s = 30

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
timeout_s = 180

[providers.mistral]
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
timeout_s = 120
# Free "Experiment" tier monthly allowance, shared across models (check
# admin.mistral.ai -> Limits for your workspace's current numbers).
limits = { tpmo = 1_000_000_000 }

[providers.zai]
# Z.AI global platform. (open.bigmodel.cn is Zhipu's separate mainland-China
# platform with its own accounts and keys.)
base_url = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
timeout_s = 120

[providers.cloudflare]
# Workers AI through this project's own Worker (AI binding), so the runner
# needs no extra Cloudflare credential: it reuses INGEST_TOKEN. To call the
# Workers AI REST API directly instead, use
#   base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
#   api_key_env = "CLOUDFLARE_AI_TOKEN"   (token with Workers AI permission)
base_url = "${PLATFORM_API_URL}/api/internal/ai/v1"
api_key_env = "INGEST_TOKEN"
timeout_s = 120
# The free plan allows 10,000 Neurons/day across all models. Neurons are
# not reported per request, so this is a conservative token estimate.
limits = { tpd = 150_000 }

# ------------------------------------------------------------------ Pass 1: gatekeeper
# Input: headline + subcategory + first ~2,500 characters of page 1.

[[routes.pass1]]
provider = "groq"
model = "openai/gpt-oss-20b"
json_mode = true
max_tokens = 200
extra_body = { reasoning_effort = "low" }  # its reasoning tokens count against max_tokens
limits = { rpm = 30, tpm = 8000, rpd = 1000, tpd = 200000 }

[[routes.pass1]]
provider = "mistral"
model = "ministral-8b-2512"  # free tier: 625k tokens/min, ~3 requests/s
json_mode = true
max_tokens = 200
limits = { rpm = 150, tpm = 625_000 }

[[routes.pass1]]
provider = "zai"
model = "glm-4.7-flash"
json_mode = true
max_tokens = 200
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60 }

[[routes.pass1]]
provider = "cloudflare"
model = "@cf/meta/llama-3.1-8b-instruct"
max_tokens = 200
context_tokens = 7000
spare = true
limits = { rpm = 60, tpd = 150_000 }

# Backfill: Mistral's large monthly allowance carries the bulk.
[[routes.pass1_bulk]]
provider = "mistral"
model = "ministral-8b-2512"  # free tier: 625k tokens/min, ~3 requests/s
json_mode = true
max_tokens = 200
limits = { rpm = 150, tpm = 625_000 }

[[routes.pass1_bulk]]
provider = "groq"
model = "openai/gpt-oss-20b"
json_mode = true
max_tokens = 200
extra_body = { reasoning_effort = "low" }  # its reasoning tokens count against max_tokens
limits = { rpm = 30, tpm = 8000, rpd = 1000, tpd = 200000 }

[[routes.pass1_bulk]]
provider = "zai"
model = "glm-4.7-flash"
json_mode = true
max_tokens = 200
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60 }

[[routes.pass1_bulk]]
provider = "cloudflare"
model = "@cf/meta/llama-3.1-8b-instruct"
max_tokens = 200
context_tokens = 7000
spare = true
limits = { rpm = 60, tpd = 150_000 }

# ------------------------------------------------------------------ Pass 2: deep analyst
# Weighted rotation. Nemotron 3 Super (a reasoning model) is the primary
# analyst; any <think> block is stripped before validating. NVIDIA retired
# DeepSeek-R1 and Llama 3.3 70B, and deepseek-v4.1-flash took >200 s per reply.
# Prompts larger than a model's context_tokens skip that model, so very long
# presentations and annual reports flow to GLM's 200K window.

[[routes.pass2]]
provider = "nvidia"
model = "nvidia/nemotron-3-super-120b-a12b"
weight = 3
json_mode = true
strip_reasoning = true
max_tokens = 8000
context_tokens = 120000
limits = { rpm = 40 }

[[routes.pass2]]
provider = "zai"
model = "glm-4.7-flash"
weight = 2
json_mode = true
max_tokens = 3000
context_tokens = 190000
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60 }

[[routes.pass2]]
provider = "mistral"
model = "ministral-14b-2512"  # the free tier blocks mistral-large; 937k tokens/min, 0.5 requests/s
weight = 1
json_mode = true
max_tokens = 3000
context_tokens = 120000
limits = { rpm = 25, tpm = 937_500 }

[[routes.pass2]]
provider = "cloudflare"
model = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
max_tokens = 3000
context_tokens = 24000
spare = true
limits = { rpm = 60, tpd = 60_000 }

[[routes.pass2_bulk]]
provider = "mistral"
model = "ministral-14b-2512"  # the free tier blocks mistral-large; 937k tokens/min, 0.5 requests/s
weight = 1
json_mode = true
max_tokens = 3000
context_tokens = 120000
limits = { rpm = 25, tpm = 937_500 }

[[routes.pass2_bulk]]
provider = "zai"
model = "glm-4.7-flash"
weight = 2
json_mode = true
max_tokens = 3000
context_tokens = 190000
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60 }

[[routes.pass2_bulk]]
provider = "nvidia"
model = "nvidia/nemotron-3-super-120b-a12b"
weight = 2
json_mode = true
strip_reasoning = true
max_tokens = 8000
context_tokens = 120000
limits = { rpm = 40 }

[[routes.pass2_bulk]]
provider = "cloudflare"
model = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
max_tokens = 3000
context_tokens = 24000
spare = true
limits = { rpm = 60, tpd = 60_000 }

# ------------------------------------------------------------------ Vision OCR for scanned pages

# Long documents (prompt above ~12,000 tokens: concall transcripts, investor presentations, annual
# reports) go to the long-context models so nothing is cut (blueprint §4.3).
[[routes.pass2_long]]
provider = "zai"
model = "glm-4.7-flash"
weight = 2
json_mode = true
max_tokens = 4000
context_tokens = 190000
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60 }

[[routes.pass2_long]]
provider = "mistral"
model = "ministral-14b-2512"  # the free tier blocks mistral-large; 937k tokens/min, 0.5 requests/s
weight = 1
json_mode = true
max_tokens = 4000
context_tokens = 120000
limits = { rpm = 25, tpm = 937_500 }

[[routes.pass2_long]]
provider = "nvidia"
model = "nvidia/nemotron-3-super-120b-a12b"
weight = 1
json_mode = true
strip_reasoning = true
max_tokens = 8000
context_tokens = 120000
limits = { rpm = 40 }

[[routes.vision]]
provider = "zai"
model = "glm-4.6v-flash"
max_tokens = 2500
extra_body = { thinking = { type = "disabled" } }  # reasoning tokens would eat the transcription
limits = { rpm = 60 }

[[routes.vision]]
provider = "mistral"
model = "mistral-small-2603"  # takes images; free tier 20k tokens/min, 1 request/s
max_tokens = 2500
limits = { rpm = 50, tpm = 20_000 }
