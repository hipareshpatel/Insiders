# ------------------------------------------------------------------ Pass 2: deep analyst
# Weighted rotation. Nemotron 3 Super (a reasoning model) is the primary
# analyst; any <think> block is stripped before validating. NVIDIA retired
# DeepSeek-R1 and Llama 3.3 70B, and deepseek-v4.1-flash took >200 s per reply.
# Prompts larger than a model's context_tokens skip that model, so very long
# presentations and annual reports flow to GLM's 200K window.

# Pass 2 weights follow the card audit (docs/audit, round 1, 98 cards on the current code; round 0 in round-0 terms
# in brackets). Share of cards wrong by writer: GLM-4.5-Flash 0% and 1.0 issues a card, Nemotron 3 Super 28% / 2.0 [20%],
# GLM-4.7-Flash 33% [73%], DeepSeek-Flash 47% / 1.9, ministral-14b 67% / 3.6 [81%]. So GLM-4.5-Flash now carries the
# largest share, the paid route sits below Nemotron Super despite its speed (D24, D25), and ministral-14b is off pass 2
# altogether - two rounds running it was the worst writer, and as a spare it still wrote 18 of the 98 cards. Nemotron 3
# Ultra was a spare on every route (owner, 2026-10-16: 53% wrong) and is off every card route since round 4 (2026-10-19:
# as a spare on free tiers it still wrote 12 of 122 cards, 58% WRONG; Nemotron 3 Super 26% of 65, GLM-4.5-Flash 17% of
# 24, Nemotron 3.5 Super VL 10% of 10, Gemini 11% of 9). Nemotron 3.5 Super VL
# (33% wrong on 6 cards in round 1, 10% of 10 in round 4) takes a share of the live route too. Samples are 15-43 cards and the hard filings cluster,
# so re-weight from each round (docs/AUDIT_LOOP.md).
[[routes.pass2]]
provider = "deepseek"
model = "deepseek-flash"
weight = 3
json_mode = true
max_tokens = 6000
context_tokens = 900000  # 1M window: no filing is too long for it
extra_body = { thinking = { type = "disabled" } }  # on by default at high effort
limits = { rpm = 60 }

[[routes.pass2]]
provider = "nvidia"
model = "nvidia/nemotron-3-super-120b-a12b"
weight = 5
json_mode = false  # no JSON mode with thinking off: it answers "{}"; the reply is parsed and repaired as for other models
strip_reasoning = true
extra_body = { chat_template_kwargs = { enable_thinking = false } }  # owner, 2026-10-16: thinking off (D21)
max_tokens = 8000
context_tokens = 120000
limits = { rpm = 40 }

[[routes.pass2]]
