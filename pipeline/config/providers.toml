# AI providers and routes for the centralized gateway.
#
# Every provider speaks the OpenAI chat-completions protocol. Model IDs and
# free-tier limits change often: check each console and edit this file; no
# code change is needed. A provider whose key (or base-URL variable) is unset
# is skipped, so the pipeline runs with any subset of providers.
#
# Operational rules (see bse_intel/ai/gateway.py):
# * 95% safety ceiling: every limit below is scaled by `safety_ceiling`. A
#   model leaves the active pool at 95% of its daily/monthly quota, and
#   per-minute pacing keeps it under 95% of rpm/tpm. A 429 puts the model in
#   cooldown (Retry-After), and a 429 that mentions a daily quota retires it
#   for the day.
# * Never hammer one provider: routes listed under [gateway.strategies] as
#   "weighted" rotate across their pool by `weight` (smooth round-robin);
#   other routes are priority order.
# * `spare = true` targets are used only after every other target failed or
#   hit its ceiling.
# * Graceful degradation: when nothing can serve a request, the pipeline
#   waits 60 s and retries if the blockers are per-minute limits/cooldowns,
#   or leaves the filing PENDING in the D1 queue if they are daily/monthly
#   ceilings. Nothing is dropped.
#
# Limits are per model unless set on the provider (shared allowances such as
# a monthly token budget across all of a provider's models).

[gateway]
safety_ceiling = 0.95

# Live filings keep the best free writer (docs/audit/ai-quality-plan-2026-10-21.md, item 1). On 20 Oct Gemini Flash
# served 62 requests but wrote only ~9 of the week's 100 live cards: backfill packs spent the rest (inferred from the
# usage and feed counts). A backfill request (pass2_bulk, a backfill pack, a backfill long filing) may use a model below
# only while that model's day stays under (1 - share) of its ceiling - 3 of its 19 requests - except in bulk_hours
# (IST), after the evening results flood and before the morning's filings. Otherwise backfill writes with GLM and Lite.
# Live requests and the fallback order are unchanged. Gemini's day ends at midnight Pacific (12:30 IST), so the bulk
# hours share a quota day with the next morning: they keep bulk_hours_share for it (the 09:00-12:30 IST window held 15
# of 56 live cards on 16, 19 and 20 Oct, 27%; on 21 Oct every Flash model was at its day by 08:30 IST).
[gateway.live_reserve]
share = 0.8
bulk_hours = "21:00-09:00"
bulk_hours_share = 0.3
tz = "Asia/Kolkata"
models = ["gemini:gemini-3.6-flash", "gemini:gemini-3.7-flash", "gemini:gemini-3.8-flash", "gemini:gemini-3.5-flash",
          "gemini:gemini-3-flash-preview"]

[gateway.strategies]
pass2 = "weighted"
pass2_bulk = "weighted"
pass2_long = "weighted"

# ------------------------------------------------------------------ providers

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
timeout_s = 30

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
# Nemotron thinks before answering. D21 (2026-10-16): switched off for Pass 2 on every route. A 20-filing A/B on the same
# model and prompt: thinking on 150-760 s a card and 1 in 3 timed out at 300 s; off 23-68 s with the same grounding scores.
# To re-enable (PLAN item 14, the last item): remove the extra_body line and set json_mode = true on the three entries.
timeout_s = 300

[providers.mistral]
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
timeout_s = 120
# Free "Experiment" tier monthly allowance, shared across models (check
# admin.mistral.ai -> Limits for your workspace's current numbers).
limits = { tpmo = 1_000_000_000 }

[providers.zai]
# Z.AI global platform. (open.bigmodel.cn is Zhipu's separate mainland-China
# platform with its own accounts and keys.)
base_url = "https://api.z.ai/api/paas/v4"
# The free Flash models allow one request in flight per key (concurrency = 1 on each route below):
# with several workers, the gateway waits up to 10 s for the slot, then tries the next model.
# 2026-10-16 (owner): GLM-4.5-Flash replaces GLM-4.7-Flash on Pass 1 and Pass 2. Head to head on tiny calls: 4.5 answered 20 of 20,
# 4.7 only 4 of 20 (errors 1302 concurrency, 1305 overloaded, 1234 server); on real Pass 2 prompts 4.5 answered every filing so far at
# 12-96 s. 4.7 stays on pass2_long only, because 4.5's window is 128K against 4.7's 200K.
api_key_env = "ZAI_API_KEY"
timeout_s = 120

[providers.gemini]
# Google AI Studio key, through Gemini's OpenAI-compatible endpoint. Free-tier
# limits are per model per Google Cloud project (extra keys in one project add
# nothing). Google publishes no free-tier table. AI Studio -> Rate Limit
# (project "Insiders", Free tier, 2026-10-16) shows 15 RPM for 3.1 and 3.5
# Flash-Lite, 5 RPM for 3.6 and 3.8 Flash and 250K TPM for each; the RPM matches
# the quota named in Gemini's own 429 replies. The daily limits are still
# guesses: a 429 naming a per-day quota retires the model until midnight
# Pacific and its value shows as the model's last error on the System page.
# Measured 2026-10-19 (Gemini's own 429 quota detail): 20 requests a day per
# model for 3.5 and 3.6 Flash, each model counted apart; 3.7 and 3.8 Flash
# answer (33 s and 52 s for a one-word reply); 2.5 Flash and Pro are retired.
# Free-tier prompts may be used by Google to improve its products, which is
# acceptable here because BSE filings are public. gemini-4-argon and
# gemini-3.1-pro-preview are paid-only.
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
quota_tz = "America/Los_Angeles"   # its daily quotas end at midnight Pacific (12:30 IST in summer, 13:30 in winter)
api_key_env = "GEMINI_API_KEY"
timeout_s = 300  # a packed pass-2 request carries several filings and runs for minutes

[providers.cloudflare]
# Workers AI through this project's own Worker (AI binding), so the runner
# needs no extra Cloudflare credential: it reuses INGEST_TOKEN. To call the
# Workers AI REST API directly instead, use
#   base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
#   api_key_env = "CLOUDFLARE_AI_TOKEN"   (token with Workers AI permission)
base_url = "${PLATFORM_API_URL}/api/internal/ai/v1"
api_key_env = "INGEST_TOKEN"
timeout_s = 120
# The free plan allows 10,000 Neurons/day across all models. Neurons are
# not reported per request, so this is a conservative token estimate.
limits = { tpd = 150_000 }

[providers.openrouter]
# One account (decision D1). OpenRouter's free models (":free") share one allowance:
# 20 requests a minute and 50 a day without purchased credits, 1,000 a day once $10 of
# credits has ever been bought (openrouter.ai/docs, Limits); extra keys or accounts add
# nothing. Free models rotate and are throttled at peak, so they are spares only. Probed
# 2026-10-16 with a lakh-to-crore JSON question: nemotron-3-ultra-550b and
# nemotron-3.5-super-vl answered correctly; gemma-4-31b was rate-limited upstream,
# inkling is app-only, nemotron-3.5-lightning returned nothing. Each route below is
# capped at 10/min so the two models together stay under the 20/min allowance.
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_s = 180
# Credits bought 2026-10-16 ($11, so the key reports is_free_tier = false): 1,000 a day.
# Only ":free" models are configured, so the credit is not spent (a test enforces it).
limits = { rpd = 1_000 }  # all free models together

[providers.deepseek]
# The only paid provider (owner, 2026-10-16): a prepaid balance, no card on file, so the
# top-up is the spending cap. Off-peak is every hour outside 01:00-04:00 and 06:00-10:00 UTC
# on weekdays, which covers the overnight runs here, and halves the price. Thinking is ON by
# default at high effort: every route below disables it (D21 again; NVIDIA's hosted copy of
# this model took >200 s a reply with thinking on). Prompt-prefix caching is automatic and
# charges cache hits at 2% of the miss price, so the prompt puts the blocks that repeat
# across a company's filings first (config/prompts/pass2_user.md).
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
timeout_s = 120
paid = true  # left out of the steps that run every day (annual_catchup.py), even where the key is loaded

# Second keys (owner, 2026-10-22: "work load will get divided and less chances of having errors"; the owner takes the
# risk that a provider's terms count one person's keys together). Each is a copy of its provider under its own name:
# every route entry of the base provider is repeated for it (gateway.expand_key_aliases), with its own limits, quota
# and System-page row. Nothing changes until the secret is set.
[providers.gemini_2]
same_as = "gemini"
api_key_env = "GEMINI_API_KEY_2"

[providers.groq_2]
same_as = "groq"
api_key_env = "GROQ_API_KEY_2"

[providers.nvidia_2]
same_as = "nvidia"
api_key_env = "NVIDIA_API_KEY_2"

[providers.zai_2]
same_as = "zai"
api_key_env = "ZAI_API_KEY_2"

[providers.siliconflow]
# Owner's key, from the international site (owner, 2026-10-20), so the .com endpoint. Measured 2026-10-20 (providers
# check run 2): the key lists ~80 models, but all six candidates tried (DeepSeek-V4.1-Flash, Qwen3.8-27B, GLM-4.5-Air,
# Qwen3-30B-A3B, gpt-oss-120b, Qwen3-8B) answer 402 "account balance is insufficient": nothing free without a balance.
base_url = "https://api.siliconflow.com/v1"
api_key_env = "SILICONFLOW_API_KEY"
timeout_s = 120

[providers.sambanova]
# Owner's key, 2026-10-19. Measured 2026-10-20 (providers check run 2): the key lists six models, and every one answers
# 402 PAYMENT_METHOD_REQUIRED: SambaNova's free tier needs a payment method on file. No route.
base_url = "https://api.sambanova.ai/v1"
api_key_env = "SAMBANOVA_API_KEY"
timeout_s = 120

