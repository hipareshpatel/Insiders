# Measured 26 Oct: run 1 on pass2_long (40306940769) was served by Flash-Lite with a 6,000-token reply, 67 points over ten
# documents against the blind reviewers' 178; run 2 (40308409939) on the free side models failed 8 of 10 documents: Gemma 4
