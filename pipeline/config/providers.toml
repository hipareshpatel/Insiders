# AI providers and routes for the centralized gateway.
#
# Every provider speaks the OpenAI chat-completions protocol. Model IDs and
# free-tier limits change often: check each console and edit this file; no
# code change is needed. A provider whose key (or base-URL variable) is unset
# is skipped, so the pipeline runs with any subset of providers.
#
# Operational rules (see bse_intel/ai/gateway.py):
# * 95% safety ceiling: every limit below is scaled by `safety_ceiling`. A
#   model leaves the active pool at 95% of its daily/monthly quota, and
#   per-minute pacing keeps it under 95% of rpm/tpm. A 429 puts the model in
#   cooldown (Retry-After), and a 429 that mentions a daily quota retires it
#   for the day.
# * Never hammer one provider: routes listed under [gateway.strategies] as
#   "weighted" rotate across their pool by `weight` (smooth round-robin);
#   other routes are priority order.
# * `spare = true` targets are used only after every other target failed or
#   hit its ceiling.
# * Graceful degradation: when nothing can serve a request, the pipeline
#   waits 60 s and retries if the blockers are per-minute limits/cooldowns,
#   or leaves the filing PENDING in the D1 queue if they are daily/monthly
#   ceilings. Nothing is dropped.
#
# Limits are per model unless set on the provider (shared allowances such as
# a monthly token budget across all of a provider's models).

[gateway]
safety_ceiling = 0.95

[gateway.strategies]
pass2 = "weighted"
pass2_bulk = "weighted"
pass2_long = "weighted"

# ------------------------------------------------------------------ providers

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
timeout_s = 30

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
timeout_s = 180

[providers.mistral]
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
timeout_s = 120
# Free "Experiment" tier monthly allowance, shared across models (check
# admin.mistral.ai -> Limits for your workspace's current numbers).
limits = { tpmo = 1_000_000_000 }

[providers.zai]
# Z.AI global platform. (open.bigmodel.cn is Zhipu's separate mainland-China
# platform with its own accounts and keys.)
base_url = "https://api.z.ai/api/paas/v4"
# The free Flash models allow one request in flight per key (concurrency = 1 on each route below):
# with several workers, the gateway waits up to 10 s for the slot, then tries the next model.
api_key_env = "ZAI_API_KEY"
timeout_s = 120

[providers.gemini]
# Google AI Studio key, through Gemini's OpenAI-compatible endpoint. Free-tier
# limits are per model per Google Cloud project (extra keys in one project add
# nothing). Google publishes no free-tier table. AI Studio -> Rate Limit
# (project "Insiders", Free tier, 2026-10-16) shows 15 RPM for 3.1 and 3.5
# Flash-Lite, 5 RPM for 3.6 and 3.8 Flash and 250K TPM for each; the RPM matches
# the quota named in Gemini's own 429 replies. The daily limits are still
# guesses: a 429 naming a per-day quota retires the model until midnight
# Pacific and its value shows as the model's last error on the System page.
# Free-tier prompts may be used by Google to improve its products, which is
# acceptable here because BSE filings are public. gemini-4-argon and
# gemini-3.1-pro-preview are paid-only.
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
timeout_s = 120

[providers.cloudflare]
# Workers AI through this project's own Worker (AI binding), so the runner
# needs no extra Cloudflare credential: it reuses INGEST_TOKEN. To call the
# Workers AI REST API directly instead, use
#   base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
#   api_key_env = "CLOUDFLARE_AI_TOKEN"   (token with Workers AI permission)
base_url = "${PLATFORM_API_URL}/api/internal/ai/v1"
api_key_env = "INGEST_TOKEN"
timeout_s = 120
# The free plan allows 10,000 Neurons/day across all models. Neurons are
# not reported per request, so this is a conservative token estimate.
limits = { tpd = 150_000 }

[providers.openrouter]
# One account (decision D1). OpenRouter's free models (":free") share one allowance:
# 20 requests a minute and 50 a day without purchased credits, 1,000 a day once $10 of
# credits has ever been bought (openrouter.ai/docs, Limits); extra keys or accounts add
# nothing. Free models rotate and are throttled at peak, so they are spares only. Probed
# 2026-10-16 with a lakh-to-crore JSON question: nemotron-3-ultra-550b and
# nemotron-3.5-super-vl answered correctly; gemma-4-31b was rate-limited upstream,
# inkling is app-only, nemotron-3.5-lightning returned nothing. Each route below is
# capped at 10/min so the two models together stay under the 20/min allowance.
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_s = 180
limits = { rpd = 50 }  # all free models together; 1_000 after a one-time $10 credit purchase

# ------------------------------------------------------------------ Pass 1: gatekeeper
# Input: headline + subcategory + first ~2,500 characters of page 1.

[[routes.pass1]]
provider = "groq"
model = "openai/gpt-oss-20b"
json_mode = true
max_tokens = 200
extra_body = { reasoning_effort = "low" }  # its reasoning tokens count against max_tokens
limits = { rpm = 30, tpm = 8000, rpd = 1000, tpd = 200000 }

[[routes.pass1]]
provider = "mistral"
model = "ministral-8b-2512"  # free tier: 625k tokens/min, ~3 requests/s
json_mode = true
max_tokens = 200
limits = { rpm = 150, tpm = 625_000 }

[[routes.pass1]]
provider = "zai"
model = "glm-4.7-flash"
json_mode = true
max_tokens = 200
extra_body = { thinking = { type = "disabled" } }
limits = { rpm = 60, concurrency = 1 }  # free GLM: one request at a time

[[routes.pass1]]
provider = "gemini"
model = "gemini-3.1-flash-lite"  # free tier: 15 requests/min measured; ~500/day unconfirmed
json_mode = true
max_tokens = 400
extra_body = { reasoning_effort = "low" }  # thinking tokens count against max_tokens
limits = { rpm = 15, tpm = 250_000, rpd = 500 }

[[routes.pass1]]
provider = "gemini"
model = "gemini-3.5-flash-lite"  # free tier: 15 requests/min measured; ~500/day unconfirmed
json_mode = true
max_tokens = 400
extra_body = { reasoning_effort = "low" }  # thinking tokens count against max_tokens
limits = { rpm = 15, tpm = 250_000, rpd = 500 }

[[routes.pass1]]
provider = "cloudflare"
model = "@cf/meta/llama-3.1-8b-instruct-fp8"  # the plain 8B was deprecated on 2026-05-30
max_tokens = 200
context_tokens = 7000
spare = true
limits = { rpm = 60, tpd = 150_000 }

