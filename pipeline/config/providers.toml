# same rule as the trial writers (at most about 8% WRONG). Probed and not used: 3.1 Pro, pro-latest, Gemini 4 Argon,
# Omni Flash and Omni 1.1 Flash have no free quota; 2.0 Flash/Lite and 2.5 Flash/Pro/Flash Lite are retired; Gemma 4
# 26B/31B on Gemini's API returned server errors twice (Gemma 4 31B runs on OpenRouter).
[[routes.pass2_packed]]
provider = "gemini"
model = "gemini-3.5-flash-lite"
json_mode = true
max_tokens = 60000
context_tokens = 900000
extra_body = { reasoning_effort = "low" }
limits = { rpm = 15, tpm = 250_000, rpd = 500 }

