# The switches every job runs with: the live pipeline, the quick run, the card refresh, the nightly annual-report
# re-run, the seed and the maintenance jobs (owner, 27 Oct 2026: "one list for every job"). Before this file each
# workflow set its own, and the quick run that writes today's cards had none of the ones the main run turned on.
#
# A switch not listed here is off. A repository variable of the same name, when set, wins over this file in every job
# (workflows pass all repository variables in REPO_VARS), so "0" there turns one off everywhere without a code change.
# An environment variable set by a workflow step wins over both.
#
# Turned on 27 Oct 2026 (owner: "Whatever can be switch ON, do it"); not yet measured on live cards: the release check
# (run 40407491267) stopped at 6 hours with nothing saved. The measurement is a blind audit of cards written after this
# file is live.

[on]
EPS_SHARE_ADJUST = true          # F153: EPS changes on one share count across splits and bonuses (live-bug fix, 25 Oct)
CARD_GROUND_ALL_FIELDS = true    # F204: figures in the timeline, risks and targets are grounded too
CARD_GROUNDED_FIGURES = true     # F171
CARD_ONE_BASIS = true            # F173: one basis a figure
CARD_SAME_DEFINITION = true      # F155
CARD_YOY_RESTATED = true         # F202: restated comparatives when memory holds them
CARD_FOOTER_PLAUSIBLE = true     # F182: a footer figure that cannot be right is left off
QUOTE_EXACT_NUMBERS = true       # F156
CARD_EPS_FOLLOWS_PROFIT = true   # F183 (EPS is not shown; memory side only)
EPS_BASE_CHECK = true            # F208: standalone EPS stored as consolidated refused (Wipro)
EPS_SHARE_COUNT_CHECK = true     # F211: split/bonus adjusted only when the record and the share count agree
CARD_RESULTS_ONE_LINE = true     # F206: a results row's figures from one statement line
CARD_WATCH_VERDICT = true        # F205: code decides met / missed / not due
# Turned on 30 Oct 2026, ~00:40 IST (owner: "Turn on a, b, c and d"): how a card states its figures. Measured after
# the fact by the next blind audit of live cards; a repository variable of the same name set to 0 turns one back off.
CARD_CONSOLIDATED_ONLY = true    # F154: a consolidated filer's card states consolidated figures only
CARD_EBITDA_PROFIT_V2 = true     # F151: the company's own EBITDA first, ours as "calculated"; one profit line
CARD_TWO_PARTS = true            # F152: "From the filing (checked)" and "Our reading (AI)"; a failing AI line hidden alone
CARD_GUIDANCE_DATED = true       # F172: a guidance verdict only from a dated target due this period
# On 30 Oct 2026, ~05:40 IST (owner, ~02:55 IST: Yes to the new reader once #218's review is clean): the unit-slip check asks
# the numbers-first PDF reader first; where it gives no answer the text-layer reader decides, as before. Out of sample
# (docs/bench/oos/README.md): 243 right / 11 wrong / 246 none of 500, the 11 a PBT definition and a file's own unit; the
# read is capped at SLIP_CHECK_NUMFIRST_SECONDS (60) and never waits past it for the OCR lock (#218).
SLIP_CHECK_NUMFIRST = true       # slip_check.PdfCheck: numbers-first reader first, the old reader the fallback
# On 30 Oct 2026, ~06:45 IST (owner: "Switch it ON", TODO 101): each call transcript and deck gets its own memory reading on
# the third Gemini key, every point checked by code before it is kept. Measured before: the second blind check of 10
# documents found 59 of 123 important points (48%), 3 of 120 kept points wrong (2.5%; bar 2%). A repository variable
# MEMORY_CALL_V2 = 0 turns it off in every job, the call-memory job included.
MEMORY_CALL_V2 = true            # F180: the 15-minute run queues transcripts and decks; call-memory.yml reads them
# On 30 Oct 2026, ~07:55 IST (lead, the owner's technical calls left to the lead): the unit-slip check's text-layer fallback
# reads with the F215 options on, as the bench scored it (hard key 156 right / 0 wrong on, 65 / 10 off; out of sample,
# numbers-first then this fallback 267 right / 12 wrong of 500, against 262 / 12 off).
SLIP_CHECK_READER_OPTIONS = true # slip_check.PdfCheck: the fallback reader with PDF_DATES_2DIGIT, PDF_PAGE_RANK, PDF_ROW_FIXES
# On 30 Oct 2026 (owner: Yes): memory's statement figures (dossier.STATEMENT_FIGURES) enter memory only from the exchange's
# file or code computed on it (lab.by "file" / "calc"), never from a card's AI reading ("memory must be filled using exchange
# data and screener rules not using cards data"). A late file is waited for (event_catchup.results_catch_up). A repository
# variable MEMORY_FILE_ONLY = 0 turns it off in every job.
MEMORY_FILE_ONLY = true          # dossier merge: a card's reading of a statement figure stays on its card
# On 30 Oct 2026, ~16:00 IST (owner: "Yes, switch on the new results cards", TODO 134): a results card's table, figures and
# changes come from memory's exchange-file statements by screener's rules (fact_sheet.py); the AI writes the words and a line
# the sheet contradicts is cut. Blind A/B round 2 (9 filings): WRONG 9 on against 14 off, better on 8 of 9, worse on none. A
# repository variable CARD_FACT_SHEET = 0 turns it off; 20 live cards are blind-scored the next day.
CARD_FACT_SHEET = true           # pipeline: the results card's figures from the exchange file in memory
# On 30 Oct 2026, ~19:20 IST (owner: "Yes, switch on the faster PDF setting"): the numbers-first reader stops reading scanned
# pages once both bases are stated (docs/bench/stop-early-live.md: 72 stored PDFs, 0 of 341 key figures changed, 11.3 s saved
# a filing; 5 filings come inside the slip check's 60 s cap only with it on, none of their revenue or total income wrong).
# A repository variable NUMFIRST_STOP_EARLY = 0 turns it off; the next 20 live results filings are checked against the file.
NUMFIRST_STOP_EARLY = true       # pdf_numbers_first: stop early on scanned pages
# TODO 144 (owner approved the build, 30 Oct 2026): a deck slide's figure tied to its label by the page's word boxes; off until
# measured on the stored deck PDFs (pipeline/scripts/measure_slide_geometry.py, a maintenance run) and the owner says on.
CALL_MEMORY_GEOMETRY = false     # slide_geometry.py: a slide point whose figure stands by another label is dropped ("label")
